<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>LKPD 2: Persamaan Laju Reaksi dan Orde Reaksi - EduKinetika</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --aksen: #7c3aed;
            --aksen-muda: #ede9fe;
            --tinta: #0f172a;
            --teks: #334155;
            --redup: #64748b;
            --garis: #e2e8f0;
            --latar: #f4f7fa;
            --kartu: #ffffff;
        }

        * {
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
            -webkit-text-size-adjust: 100%;
        }

        body {
            margin: 0;
            font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
            color: var(--teks);
            background: var(--latar);
            background-image: radial-gradient(#e2e8f0 1px, transparent 1px);
            background-size: 28px 28px;
            line-height: 1.6;
        }

        a {
            color: var(--aksen);
        }

        .fase,
        #bagian-identitas,
        .soal {
            scroll-margin-top: 120px;
        }

        .wadah {
            max-width: 900px;
            margin: 0 auto;
            padding: 0 16px;
        }

        /* ---------- Bilah alat ---------- */
        .bilah {
            position: sticky;
            top: 0;
            z-index: 40;
            background: rgba(255, 255, 255, .92);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--garis);
        }

        .bilah-isi {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
            padding: 10px 16px;
            max-width: 900px;
            margin: 0 auto;
        }

        .bilah .judul-kecil {
            font-weight: 800;
            color: var(--tinta);
            font-size: .92rem;
            flex: 1 1 180px;
            min-width: 0;
        }

        .bilah .judul-kecil small {
            display: block;
            font-weight: 600;
            color: var(--redup);
            font-size: .72rem;
        }

        .simpan-info {
            font-size: .75rem;
            font-weight: 700;
            color: var(--redup);
            display: flex;
            align-items: center;
            gap: 6px;
            white-space: nowrap;
        }

        .simpan-info .titik {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #cbd5e1;
        }

        .simpan-info.ok .titik {
            background: #10b981;
        }

        .simpan-info.proses .titik {
            background: #f59e0b;
        }

        .simpan-info.lokal .titik {
            background: #3b82f6;
        }

        .simpan-info.galat .titik {
            background: #ef4444;
        }

        .tombol {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            border-radius: 12px;
            padding: 10px 14px;
            font: inherit;
            font-weight: 800;
            font-size: .85rem;
            border: 2px solid var(--garis);
            background: #fff;
            color: var(--tinta);
            cursor: pointer;
            text-decoration: none;
            transition: transform .1s, background .15s, border-color .15s;
        }

        .tombol:hover {
            border-color: var(--aksen);
        }

        .tombol:active {
            transform: scale(.98);
        }

        .tombol.utama {
            background: var(--aksen);
            border-color: var(--aksen);
            color: #fff;
        }

        .tombol.utama:hover {
            filter: brightness(1.07);
        }

        .tombol:disabled {
            opacity: .5;
            cursor: not-allowed;
        }

        .progres {
            height: 4px;
            background: #eef2f7;
        }

        .progres span {
            display: block;
            height: 100%;
            background: var(--aksen);
            width: 0;
            transition: width .4s;
        }

        /* ---------- Langkah fase ---------- */
        .langkah {
            display: flex;
            gap: 6px;
            overflow-x: auto;
            padding: 8px 16px 10px;
            max-width: 900px;
            margin: 0 auto;
            scrollbar-width: none;
        }

        .langkah::-webkit-scrollbar {
            display: none;
        }

        .langkah a {
            flex: 0 0 auto;
            text-decoration: none;
            font-size: .74rem;
            font-weight: 800;
            color: var(--redup);
            background: #fff;
            border: 1px solid var(--garis);
            border-radius: 999px;
            padding: 5px 11px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .langkah a .n {
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: #eef2f7;
            display: grid;
            place-items: center;
            font-size: .66rem;
        }

        .langkah a.aktif {
            background: var(--aksen);
            color: #fff;
            border-color: var(--aksen);
        }

        .langkah a.aktif .n {
            background: rgba(255, 255, 255, .25);
        }

        .langkah a.lengkap .n {
            background: #10b981;
            color: #fff;
        }

        /* ---------- Kartu umum ---------- */
        .kartu {
            background: var(--kartu);
            border: 1px solid #edf1f6;
            border-radius: 22px;
            box-shadow: 0 10px 30px -22px rgba(15, 23, 42, .45);
            padding: 20px;
            margin: 18px 0;
        }

        .sampul {
            position: relative;
            overflow: hidden;
            margin-top: 22px;
            background: linear-gradient(135deg, var(--aksen), var(--aksen-gelap, #1e3a8a));
            color: #fff;
            border: 0;
        }

        .sampul .label {
            display: inline-block;
            background: rgba(255, 255, 255, .18);
            border: 1px solid rgba(255, 255, 255, .3);
            border-radius: 999px;
            padding: 4px 12px;
            font-size: .75rem;
            font-weight: 800;
        }

        .sampul h1 {
            margin: 12px 0 6px;
            font-size: clamp(1.5rem, 4.2vw, 2.2rem);
            line-height: 1.15;
            letter-spacing: -.02em;
            color: #fff;
        }

        .sampul p {
            margin: 0;
            opacity: .92;
            max-width: 60ch;
        }

        .sampul .meta {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 16px;
        }

        .sampul .meta span {
            background: rgba(255, 255, 255, .15);
            border-radius: 10px;
            padding: 6px 10px;
            font-size: .78rem;
            font-weight: 700;
        }

        .sampul .hiasan {
            position: absolute;
            right: -30px;
            bottom: -40px;
            width: 220px;
            opacity: .16;
            pointer-events: none;
        }

        h2.judul-bagian {
            font-size: 1.25rem;
            margin: 0;
            color: var(--tinta);
            letter-spacing: -.01em;
        }

        h3 {
            color: var(--tinta);
        }

        .kepala-fase {
            display: flex;
            gap: 14px;
            align-items: flex-start;
        }

        .kepala-fase .no {
            width: 46px;
            height: 46px;
            flex: 0 0 46px;
            border-radius: 14px;
            background: var(--aksen-muda);
            color: var(--aksen);
            display: grid;
            place-items: center;
            font-weight: 800;
            font-size: 1.05rem;
        }

        .kepala-fase .sub {
            font-size: .75rem;
            font-weight: 800;
            color: var(--aksen);
        }

        .kepala-fase .ket {
            font-size: .85rem;
            color: var(--redup);
            margin-top: 2px;
        }

        .daftar {
            margin: 8px 0 0;
            padding-left: 20px;
        }

        .daftar li {
            margin: 4px 0;
        }

        .info {
            background: #f8fafc;
            border: 1px solid var(--garis);
            border-radius: 16px;
            padding: 14px 16px;
            margin: 14px 0;
        }

        .info.masalah {
            background: linear-gradient(180deg, #fff7ed, #fff);
            border-color: #fed7aa;
        }

        .info.masalah .tag {
            color: #c2410c;
        }

        .info .tag {
            font-size: .75rem;
            font-weight: 800;
            color: var(--aksen);
            display: flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 4px;
        }

        details.bantuan {
            border: 1px dashed #93c5fd;
            background: #eff6ff;
            border-radius: 14px;
            padding: 0 14px;
            margin: 12px 0;
        }

        details.bantuan summary {
            cursor: pointer;
            font-weight: 800;
            font-size: .85rem;
            color: #1d4ed8;
            padding: 10px 0;
            list-style: none;
        }

        details.bantuan summary::-webkit-details-marker {
            display: none;
        }

        details.bantuan summary::before {
            content: '💡 ';
        }

        details.bantuan[open] {
            padding-bottom: 12px;
        }

        details.bantuan .isi {
            font-size: .88rem;
        }

        .tautan-daftar {
            display: grid;
            gap: 8px;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            margin: 12px 0;
        }

        .tautan-daftar a {
            display: block;
            text-decoration: none;
            background: #fff;
            border: 2px solid var(--garis);
            border-radius: 14px;
            padding: 12px 14px;
            color: var(--tinta);
        }

        .tautan-daftar a:hover {
            border-color: var(--aksen);
        }

        .tautan-daftar a strong {
            display: block;
        }

        .tautan-daftar a span {
            font-size: .78rem;
            color: var(--redup);
        }

        /* ---------- Soal ---------- */
        .soal {
            margin: 18px 0 6px;
            padding-top: 16px;
            border-top: 1px solid #f1f5f9;
        }

        .soal:first-child {
            border-top: 0;
            padding-top: 0;
        }

        .soal .tanya {
            display: flex;
            gap: 10px;
            align-items: flex-start;
        }

        .soal .nomor {
            flex: 0 0 auto;
            min-width: 30px;
            height: 30px;
            padding: 0 6px;
            border-radius: 9px;
            background: var(--tinta);
            color: #fff;
            display: grid;
            place-items: center;
            font-weight: 800;
            font-size: .8rem;
        }

        .soal.terisi .nomor {
            background: #10b981;
        }

        .soal .teks-tanya {
            font-weight: 700;
            color: var(--tinta);
        }

        .chip {
            display: inline-block;
            font-size: .68rem;
            font-weight: 800;
            padding: 2px 8px;
            border-radius: 999px;
            margin-left: 4px;
            vertical-align: 2px;
        }

        .chip.tp {
            background: var(--aksen-muda);
            color: var(--aksen);
        }

        .chip.opsional {
            background: #fef3c7;
            color: #b45309;
        }

        .soal .jawab {
            margin: 10px 0 0 40px;
        }

        textarea,
        input[type=text],
        input[type=number],
        select {
            width: 100%;
            font: inherit;
            font-size: 16px;
            color: var(--tinta);
            border: 2px solid var(--garis);
            border-radius: 12px;
            padding: 10px 12px;
            background: #fff;
            transition: border-color .15s, box-shadow .15s;
        }

        textarea {
            resize: vertical;
            min-height: 88px;
            line-height: 1.55;
        }

        textarea:focus,
        input:focus,
        select:focus {
            outline: none;
            border-color: var(--aksen);
            box-shadow: 0 0 0 4px var(--aksen-muda);
        }

        textarea:disabled,
        input:disabled,
        select:disabled {
            background: #f8fafc;
            color: #475569;
        }

        .tabel-wadah {
            overflow-x: auto;
            border: 1px solid var(--garis);
            border-radius: 14px;
        }

        table.lkpd {
            border-collapse: collapse;
            width: 100%;
            min-width: 480px;
            font-size: .88rem;
        }

        table.lkpd th,
        table.lkpd td {
            border-bottom: 1px solid #eef2f7;
            padding: 8px;
            text-align: left;
            vertical-align: middle;
        }

        table.lkpd th {
            background: #f8fafc;
            font-size: .76rem;
            color: var(--redup);
            font-weight: 800;
        }

        table.lkpd td:first-child {
            font-weight: 700;
            color: var(--tinta);
            white-space: nowrap;
        }

        table.lkpd input,
        table.lkpd select {
            padding: 8px 10px;
            border-radius: 10px;
        }

        table.lkpd tr:last-child td {
            border-bottom: 0;
        }

        table.data {
            border-collapse: collapse;
            width: 100%;
            font-size: .9rem;
            margin: 10px 0;
        }

        table.data th,
        table.data td {
            border: 1px solid var(--garis);
            padding: 8px 10px;
            text-align: center;
        }

        table.data th {
            background: #f1f5f9;
            color: var(--tinta);
        }

        .pilihan-daftar {
            display: grid;
            gap: 8px;
        }

        .pilihan-daftar label {
            display: flex;
            gap: 10px;
            align-items: flex-start;
            border: 2px solid var(--garis);
            border-radius: 12px;
            padding: 10px 12px;
            cursor: pointer;
            background: #fff;
        }

        .pilihan-daftar label:has(input:checked) {
            border-color: var(--aksen);
            background: var(--aksen-muda);
        }

        .pilihan-daftar input {
            margin-top: 5px;
            accent-color: var(--aksen);
        }

        .diagram {
            background: #fff;
            border: 1px solid var(--garis);
            border-radius: 14px;
            padding: 10px;
        }

        .diagram svg {
            width: 100%;
            height: auto;
            display: block;
        }

        .penanda-daftar {
            display: grid;
            gap: 8px;
            grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
            margin-top: 10px;
        }

        .penanda-daftar label {
            display: flex;
            gap: 8px;
            align-items: center;
            font-weight: 800;
            color: var(--tinta);
        }

        .penanda-daftar .bulat {
            width: 26px;
            height: 26px;
            flex: 0 0 26px;
            border-radius: 50%;
            background: var(--aksen);
            color: #fff;
            display: grid;
            place-items: center;
            font-size: .8rem;
        }

        .grafik {
            margin-top: 10px;
            background: #fff;
            border: 1px solid var(--garis);
            border-radius: 14px;
            padding: 10px 12px;
        }

        .grafik .jdl {
            font-size: .76rem;
            font-weight: 800;
            color: var(--redup);
            margin-bottom: 4px;
        }

        .grafik svg {
            width: 100%;
            max-width: 560px;
            height: auto;
            display: block;
        }

        .data-lab {
            margin-top: 10px;
            font-size: .82rem;
            background: #f0fdf4;
            border: 1px solid #bbf7d0;
            border-radius: 12px;
            padding: 10px 12px;
        }

        .data-lab strong {
            color: #166534;
        }

        .data-lab ul {
            margin: 6px 0 0;
            padding-left: 18px;
        }

        .catatan-guru {
            margin: 10px 0 0 40px;
            background: #fff7ed;
            border: 1px solid #fdba74;
            border-radius: 12px;
            padding: 8px 12px;
            font-size: .85rem;
            color: #9a3412;
        }

        .catatan-guru::before {
            content: '✏️ Catatan guru: ';
            font-weight: 800;
        }

        .spanduk {
            border-radius: 16px;
            padding: 14px 16px;
            margin: 16px 0 0;
            font-size: .9rem;
            display: flex;
            gap: 10px;
            align-items: flex-start;
        }

        .spanduk.biru {
            background: #eff6ff;
            border: 1px solid #bfdbfe;
            color: #1e3a8a;
        }

        .spanduk.kuning {
            background: #fffbeb;
            border: 1px solid #fde68a;
            color: #92400e;
        }

        .spanduk.hijau {
            background: #ecfdf5;
            border: 1px solid #a7f3d0;
            color: #065f46;
        }

        .spanduk.merah {
            background: #fef2f2;
            border: 1px solid #fecaca;
            color: #991b1b;
        }

        .spanduk .nilai-besar {
            font-size: 2rem;
            font-weight: 800;
            line-height: 1;
        }

        .identitas {
            display: grid;
            gap: 12px;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
        }

        .identitas label {
            font-size: .78rem;
            font-weight: 800;
            color: var(--redup);
            display: grid;
            gap: 4px;
        }

        .kirim {
            text-align: center;
        }

        .kirim p {
            color: var(--redup);
            font-size: .88rem;
        }

        .toast {
            position: fixed;
            left: 50%;
            bottom: calc(16px + env(safe-area-inset-bottom, 0px));
            transform: translate(-50%, 20px);
            background: var(--tinta);
            color: #fff;
            padding: 10px 16px;
            border-radius: 12px;
            font-weight: 700;
            font-size: .88rem;
            opacity: 0;
            pointer-events: none;
            transition: .25s;
            z-index: 90;
            max-width: calc(100vw - 32px);
            text-align: center;
        }

        .toast.tampil {
            opacity: 1;
            transform: translate(-50%, 0);
        }

        .modal-latar {
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, .55);
            z-index: 80;
            display: grid;
            place-items: center;
            padding: 16px;
        }

        .modal-latar[hidden] {
            display: none;
        }

        .modal {
            background: #fff;
            border-radius: 20px;
            max-width: 440px;
            width: 100%;
            padding: 22px;
            box-shadow: 0 30px 60px rgba(0, 0, 0, .3);
        }

        .modal h3 {
            margin: 0 0 6px;
        }

        .modal .aksi {
            display: flex;
            gap: 8px;
            justify-content: flex-end;
            margin-top: 16px;
            flex-wrap: wrap;
        }

        .modal ul {
            font-size: .86rem;
            max-height: 180px;
            overflow: auto;
            padding-left: 18px;
        }

        .salah-isi {
            border-color: #f87171 !important;
        }

        .cetak-saja,
        .nilai-cetak {
            display: none;
        }

        button:focus-visible,
        a:focus-visible,
        summary:focus-visible {
            outline: 3px solid var(--aksen-muda);
            outline-offset: 2px;
        }

        @media (max-width: 560px) {
            .kartu {
                padding: 16px;
                border-radius: 18px;
            }

            .soal .jawab,
            .catatan-guru {
                margin-left: 0;
            }

            .bilah-isi {
                gap: 8px;
                padding: 8px 12px;
            }

            .bilah .judul-kecil {
                flex: 1 1 0;
                font-size: .8rem;
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis;
            }

            .bilah .judul-kecil small {
                overflow: hidden;
                text-overflow: ellipsis;
            }

            .bilah-isi .tombol {
                padding: 8px 10px;
            }

            #tombolCetak .teks-tombol {
                display: none;
            }

            .simpan-info {
                order: 5;
                flex-basis: 100%;
                font-size: .7rem;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            html {
                scroll-behavior: auto;
            }

            * {
                transition: none !important;
            }
        }

        /* ---------- CETAK / PDF ---------- */
        @page {
            size: A4;
            margin: 16mm 14mm;
        }

        @media print {
            body {
                background: #fff;
                font-size: 11pt;
                color: #000;
            }

            .bilah,
            .langkah,
            .tautan-daftar,
            details.bantuan,
            .kirim,
            .toast,
            .modal-latar,
            .layar-saja,
            .data-lab {
                display: none !important;
            }

            .wadah {
                max-width: none;
                padding: 0;
            }

            .kartu {
                box-shadow: none;
                border: 1px solid #cbd5e1;
                border-radius: 8px;
                padding: 12px 14px;
                margin: 10px 0;
                break-inside: auto;
            }

            .sampul {
                background: #fff !important;
                color: #000;
                border: 2px solid #000;
            }

            .sampul h1,
            .sampul p,
            .sampul .label,
            .sampul .meta span {
                color: #000 !important;
                background: none !important;
                border-color: #000 !important;
            }

            .sampul .hiasan {
                display: none;
            }

            .soal {
                break-inside: avoid;
            }

            .kepala-fase {
                break-after: avoid;
                page-break-after: avoid;
            }

            .info,
            .tabel-wadah,
            .diagram,
            .grafik,
            .pilihan-daftar {
                break-inside: avoid;
            }

            .cetak-saja {
                display: block;
            }

            textarea {
                display: none !important;
            }

            .nilai-cetak {
                display: block;
                white-space: pre-wrap;
                border: 1px solid #94a3b8;
                border-radius: 6px;
                padding: 6px 8px;
                min-height: 42px;
                font-size: 10.5pt;
            }

            input,
            select {
                border: 1px solid #94a3b8 !important;
                border-radius: 6px !important;
                box-shadow: none !important;
                background: #fff !important;
                color: #000 !important;
            }

            table.lkpd {
                min-width: 0;
            }

            .tabel-wadah {
                overflow: visible;
                border-color: #94a3b8;
            }

            .kepala-fase .no {
                border: 1px solid #000;
                background: #fff;

        .anim-titik button::before {

    <script>
        /* =====================================================================
           DEFINISI LKPD (isi, soal, dan struktur fase PBL)
           ===================================================================== */
        const TABEL_LANGKAH = (zat, lawan) => ({
            kepala: 'Langkah',
            baris: [`Pasangan percobaan ([${lawan}] tetap)`, 'Perbandingan laju (v₂ / v₁)', `Perbandingan [${zat}]`, 'Persamaan pangkat', `Orde terhadap ${zat}`],
            kolom: [{ judul: 'Jawaban', tipe: 'teks' }]
        });
        const TABEL_HASIL = (a, b) => ({
            kepala: 'Yang ditentukan',
            baris: [`Orde terhadap ${a}`, `Orde terhadap ${b}`, 'Orde reaksi total', 'Persamaan laju reaksi', 'Nilai k beserta satuannya'],
            kolom: [{ judul: 'Jawaban', tipe: 'teks' }]
        });
        const tabelData = (a, b, baris) => `<div style="overflow-x:auto"><table class="data"><thead><tr><th>Percobaan</th><th>[${a}] (M)</th><th>[${b}] (M)</th><th>Laju awal (M/s)</th></tr></thead><tbody>${baris.map((r, i) => `<tr><td>${i + 1}</td><td>${r[0]}</td><td>${r[1]}</td><td>${r[2]}</td></tr>`).join('')}</tbody></table></div>`;

        window.LKPD = {
            id: 'lkpd_p3',
            pertemuan: 3,
            judul: 'LKPD 3: Persamaan Laju Reaksi dan Orde Reaksi',
            subjudul: 'Bantu Dinas Lingkungan Hidup memprediksi pembentukan gas NO₂ dari emisi kendaraan dengan menentukan orde reaksi dan persamaan laju dari data eksperimen.',
            alokasi: '2 × 45 menit',
            warnaGelap: '#4c1d95',
            tujuan: [
                'Diberikan sekumpulan data hasil eksperimen kinetika kimia, peserta didik dapat menentukan orde reaksi total dari suatu reaksi kimia dengan perhitungan yang tepat.',
                'Melalui penugasan dan latihan soal, peserta didik dapat merumuskan persamaan laju reaksi <em>v</em> = <em>k</em>[A]<sup>x</sup>[B]<sup>y</sup> secara benar.',
                'Diberikan sekumpulan data hasil eksperimen kinetika kimia, peserta didik dapat mempresentasikan perhitungan orde reaksi total dari suatu reaksi kimia dengan tepat.'
            ],
            petunjuk: [
                'Isi identitas dan nama anggota kelompok, lalu siapkan kalkulator.',
                'Kerjakan setiap fase secara berurutan. Jawabanmu <strong>tersimpan otomatis</strong>.',
                'Pada Fase 3, pilih <strong>level latihan</strong> (dasar, menengah, atau tantangan) sesuai kesiapanmu.',
                'Buka <strong>Kartu contoh langkah</strong> jika kamu memerlukan panduan.',
                'Tekan <strong>Kumpulkan</strong> setelah selesai. Gunakan tombol <strong>Cetak / PDF</strong> untuk mencetak atau menyimpan LKPD.'
            ],
            bagian: [
                {
                    label: 'Fase 1', nama: 'Orientasi pada Masalah', pendek: 'Orientasi masalah', ikon: '1',
                    ket: 'Cermati permasalahan dan data eksperimen, lalu tuliskan dugaan awalmu.',
                    blok: [
                        { tipe: 'animasi', adegan: 'emisi' },
                        {
                            tipe: 'info', gaya: 'masalah', tag: '🚗 Permasalahan',
                            html: `<p style="margin:0">Dinas Lingkungan Hidup meneliti reaksi pembentukan gas NO₂ dari gas NO yang dihasilkan knalpot kendaraan:</p>
                    <p style="text-align:center;font-weight:800;margin:.6em 0">2NO(g) + O₂(g) → 2NO₂(g)</p>
                    <p style="margin:0">Tim peneliti memperoleh data berikut. <strong>Bantulah tim tersebut menentukan persamaan laju reaksi dan memprediksi laju reaksi jika konsentrasi NO di udara meningkat tiga kali akibat kemacetan!</strong></p>
                    ${tabelData('NO', 'O₂', [['0,010', '0,010', '1,2 × 10⁻⁵'], ['0,020', '0,010', '4,8 × 10⁻⁵'], ['0,020', '0,020', '9,6 × 10⁻⁵']])}`
                        },
                        { id: 'q1', tipe: 'uraian', label: 'Tuliskan informasi yang <strong>diketahui</strong> dan yang <strong>ditanyakan</strong> dari permasalahan.', baris: 4 },
                        {
                            id: 'q2', tipe: 'pilihan', alasan: true,
                            label: 'Dugaan awal: apakah orde reaksi pasti sama dengan koefisien reaksinya (NO = 2, O₂ = 1)?',
                            opsi: ['Ya, orde reaksi selalu sama dengan koefisien', 'Tidak selalu, orde harus dibuktikan dengan data eksperimen', 'Belum tahu']
                        }
                    ]
                },
                {
                    label: 'Fase 2', nama: 'Mengorganisasikan Peserta Didik untuk Belajar', pendek: 'Organisasi belajar', ikon: '2',
                    ket: 'Bagi peran kelompok dan pahami langkah metode laju awal.',
                    blok: [
                        {
                            id: 'q3', tipe: 'tabel', label: 'Tuliskan pembagian peran dalam kelompokmu.', kepala: 'Peran',
                            baris: ['Ketua', 'Pencatat perhitungan', 'Pemeriksa perhitungan', 'Penyaji'],
                            kolom: [{ judul: 'Nama anggota', tipe: 'teks' }]
                        },
                        {
                            tipe: 'info', tag: '📐 Metode laju awal',
                            html: `<ol class="daftar"><li>Tulis bentuk umum: <em>v</em> = <em>k</em>[A]<sup>x</sup>[B]<sup>y</sup>.</li><li>Untuk mencari <em>x</em>, pilih dua percobaan dengan [B] <strong>tetap</strong>; untuk <em>y</em>, pilih dua percobaan dengan [A] <strong>tetap</strong>.</li><li>Gunakan (v₂/v₁) = ([A]₂/[A]₁)<sup>x</sup>, lalu cari pangkatnya.</li><li>Orde total = <em>x</em> + <em>y</em>. Substitusikan satu data untuk menghitung <em>k</em>.</li></ol>`
                        },
                        {
                            tipe: 'bantuan', judul: 'Kartu contoh langkah pengerjaan',
                            html: `<p style="margin:0 0 6px">Contoh: reaksi A + B → C dengan data [A] 0,1 → 0,2 M ([B] tetap) dan laju 0,01 → 0,04 M/s.</p>
                    <p style="margin:0">(0,04 / 0,01) = (0,2 / 0,1)<sup>x</sup> → 4 = 2<sup>x</sup> → <strong>x = 2</strong>. Artinya [A] naik 2 kali membuat laju naik 2² = 4 kali.</p>
                    <p style="margin:6px 0 0">Ingat: 2<sup>0</sup> = 1, 2<sup>1</sup> = 2, 2<sup>2</sup> = 4, 2<sup>3</sup> = 8; 3<sup>1</sup> = 3, 3<sup>2</sup> = 9.</p>`
                        },
                        {
                            tipe: 'tautan', item: [
                                { label: 'Materi Hukum Laju & Orde Reaksi', href: 'materi4.html', ket: 'Simulator persamaan laju, contoh terbimbing, dan mode presentasi.' }
                            ]
                        }
                    ]
                },
                {
                    label: 'Fase 3', nama: 'Membimbing Penyelidikan Individu dan Kelompok', pendek: 'Penyelidikan', ikon: '3',
                    ket: 'Tentukan orde reaksi, rumuskan persamaan laju, lalu kerjakan latihan berjenjang.',
                    blok: [
                        { tipe: 'info', tag: '🔎 Menentukan orde reaksi (TP 7)', html: 'Gunakan data permasalahan pada Fase 1.' },
                        Object.assign({ id: 'q4', tipe: 'tabel', tp: 'TP 7', label: 'Tentukan orde reaksi terhadap NO.' }, TABEL_LANGKAH('NO', 'O₂')),
                        Object.assign({ id: 'q5', tipe: 'tabel', tp: 'TP 7', label: 'Tentukan orde reaksi terhadap O₂.' }, TABEL_LANGKAH('O₂', 'NO')),
                        { id: 'q6', tipe: 'isian', tp: 'TP 7', label: 'Orde reaksi total = …', placeholder: 'tuliskan perhitungannya, contoh: x + y = … + … = …' },
                        { tipe: 'info', tag: '✍️ Merumuskan persamaan laju (TP 8)', html: 'Gunakan orde yang telah kamu temukan.' },
                        { id: 'q7', tipe: 'isian', tp: 'TP 8', label: 'Tuliskan persamaan laju reaksinya.', placeholder: 'v = k[…]…[…]…' },
                        { id: 'q8', tipe: 'uraian', tp: 'TP 8', label: 'Hitung tetapan laju reaksi <em>k</em> beserta satuannya (tuliskan langkahnya).', baris: 4 },
                        { id: 'q9', tipe: 'uraian', tp: 'TP 8', label: 'Prediksi: jika [NO] di udara meningkat tiga kali akibat kemacetan ([O₂] tetap), berapa kali laju pembentukan NO₂ meningkat? Tunjukkan perhitungannya.', baris: 3 },

                        { tipe: 'info', tag: '🎯 Latihan berjenjang', html: 'Pilih satu level yang sesuai dengan kesiapanmu. Kerjakan secara mandiri, lalu diskusikan jawabannya dalam kelompok.' },
                        { id: 'level', tipe: 'pilihan', label: 'Pilih level latihan:', opsi: ['Dasar', 'Menengah', 'Tantangan'] },
                        { tipe: 'info', gaya: 'pesan-level', html: '<span style="color:#64748b">Soal latihan akan muncul setelah kamu memilih level.</span>' },

                        { tipe: 'info', level: 'Dasar', tag: 'Level dasar: konsentrasi naik dua kali', html: `<p style="margin:0">Reaksi P + Q → R memiliki data berikut.</p>${tabelData('P', 'Q', [['0,1', '0,1', '2 × 10⁻³'], ['0,2', '0,1', '8 × 10⁻³'], ['0,2', '0,2', '1,6 × 10⁻²']])}` },
                        Object.assign({ id: 'q10', tipe: 'tabel', level: 'Dasar', label: 'Tentukan hasil berikut dari data reaksi P + Q → R.' }, TABEL_HASIL('P', 'Q')),
                        { id: 'q11', tipe: 'uraian', level: 'Dasar', label: 'Tuliskan langkah perhitunganmu.', baris: 5 },

                        { tipe: 'info', level: 'Menengah', tag: 'Level menengah: konsentrasi naik tiga kali', html: `<p style="margin:0">Reaksi A + B → C memiliki data berikut.</p>${tabelData('A', 'B', [['0,1', '0,1', '2 × 10⁻³'], ['0,3', '0,1', '1,8 × 10⁻²'], ['0,1', '0,3', '6 × 10⁻³']])}` },
                        Object.assign({ id: 'q12', tipe: 'tabel', level: 'Menengah', label: 'Tentukan hasil berikut dari data reaksi A + B → C.' }, TABEL_HASIL('A', 'B')),
                        { id: 'q13', tipe: 'uraian', level: 'Menengah', label: 'Tuliskan langkah perhitunganmu, termasuk perhitungan nilai k.', baris: 5 },

                        { tipe: 'info', level: 'Tantangan', tag: 'Level tantangan: data tidak berurutan', html: `<p style="margin:0">Reaksi X + Y → Z memiliki data berikut. Perhatikan: urutan percobaan tidak teratur.</p>${tabelData('X', 'Y', [['0,2', '0,1', '4 × 10⁻³'], ['0,1', '0,2', '1 × 10⁻³'], ['0,1', '0,1', '1 × 10⁻³'], ['0,2', '0,2', '4 × 10⁻³']])}` },
                        Object.assign({ id: 'q14', tipe: 'tabel', level: 'Tantangan', label: 'Tentukan hasil berikut dari data reaksi X + Y → Z.' }, TABEL_HASIL('X', 'Y')),
                        { id: 'q15', tipe: 'uraian', level: 'Tantangan', label: 'Tuliskan langkah perhitunganmu. Apa arti orde yang kamu temukan untuk zat Y?', baris: 5 }
                    ]
                },
                {

                    blok: [
                        { id: 'q16', tipe: 'uraian', tp: 'TP 9', label: 'Susun naskah presentasi perhitungan kelompokmu secara runtut: data → pemilihan pasangan percobaan → orde tiap zat → orde total → persamaan laju → nilai k → prediksi.', baris: 6 },

                        { id: 'q18', tipe: 'uraian', label: 'Hasil verifikasi: apakah perhitungan kelompok penyaji lain sama dengan milikmu? Tuliskan koreksi atau tanggapanmu.', baris: 3 }
                    ]
                },

    <script>
        /* =====================================================================
           ANIMASI ORIENTASI MASALAH (Fase 1 PBL)
           Mesin animasi kanvas kecil: adegan bertahap + teks penjelas,
           tombol putar/jeda, ulangi, dan lompat ke adegan tertentu.
           ===================================================================== */
        (function () {
            'use strict';
            const W = 480, H = 300;
            const ADEGAN = {};
            const kurangiGerak = !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);

            // Bilangan acak berbenih agar animasi selalu sama ketika diulang
            function acak(benih) {
                let s = (benih >>> 0) || 1;
                return () => { s ^= s << 13; s >>>= 0; s ^= s >>> 17; s ^= s << 5; s >>>= 0; return s / 4294967296; };
            }

            /* ---------- Alat gambar ---------- */
            const ATOM = {
                C: ['#4b5563', 5], O: ['#ef4444', 4.8], H: ['#f8fafc', 2.8], N: ['#3b82f6', 5.2]
            };
            const BENTUK = {
                C3H8: [['H', -14, -1], ['H', -10, 8], ['H', 0, -10], ['H', 10, 8], ['H', 14, -1], ['C', -9, 2], ['C', 0, -3], ['C', 9, 2]],
                O2: [['O', -4.2, 0], ['O', 4.2, 0]],
                CO2: [['O', -8, 0], ['O', 8, 0], ['C', 0, 0]],
                H2O: [['O', 0, 0], ['H', -5.5, 4], ['H', 5.5, 4]],
                NO: [['N', -4.3, 0], ['O', 4.3, 0]],
                NO2: [['O', -7, 4], ['O', 7, 4], ['N', 0, -1]]
            };
            const U = {
                W, H, ts: 1,
                uk(n) { return n * U.ts; },
                kotak(ctx, x, y, w, h, r) {
                    r = Math.min(r, w / 2, h / 2);
                    ctx.beginPath(); ctx.moveTo(x + r, y);
                    ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
                    ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
                },
                huruf(ukuran, tebal) { return `${tebal || 700} ${ukuran || 12}px "Plus Jakarta Sans", system-ui, sans-serif`; },
                teks(ctx, s, x, y, o) {
                    o = o || {};
                    ctx.font = U.huruf(o.ukuran, o.tebal); ctx.fillStyle = o.warna || '#0f172a';
                    ctx.textAlign = o.rata || 'left'; ctx.textBaseline = o.dasar || 'alphabetic';
                    ctx.fillText(s, x, y);
                },
                label(ctx, s, x, y, o) {
                    o = o || {};
                    const uk = o.ukuran || 11;
                    ctx.font = U.huruf(uk, o.tebal || 800);
                    const w = ctx.measureText(s).width + 14, h = uk + 9;
                    const x0 = o.rata === 'center' ? x - w / 2 : o.rata === 'right' ? x - w : x;
                    U.kotak(ctx, x0, y - h / 2, w, h, h / 2);
                    ctx.fillStyle = o.latar || 'rgba(255,255,255,.94)'; ctx.fill();
                    if (o.garis) { ctx.lineWidth = 1.2; ctx.strokeStyle = o.garis; ctx.stroke(); }
                    ctx.fillStyle = o.warna || '#0f172a'; ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
                    ctx.fillText(s, x0 + 7, y + .5);
                    return w;
                },
                atom(ctx, jenis, x, y) {
                    const [warna, r] = ATOM[jenis];
                    ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fillStyle = warna; ctx.fill();
                    ctx.lineWidth = 1; ctx.strokeStyle = 'rgba(15,23,42,.55)'; ctx.stroke();
                    ctx.beginPath(); ctx.arc(x - r * .35, y - r * .38, r * .34, 0, Math.PI * 2);
                    ctx.fillStyle = 'rgba(255,255,255,.6)'; ctx.fill();
                },
                molekul(ctx, jenis, x, y, sudut, skala, alpha) {
                    ctx.save(); ctx.translate(x, y); ctx.rotate(sudut || 0);
                    if (skala && skala !== 1) ctx.scale(skala, skala);
                    ctx.globalAlpha = alpha == null ? 1 : alpha;
                    if (jenis === 'NO2') { ctx.beginPath(); ctx.arc(0, 1, 13, 0, Math.PI * 2); ctx.fillStyle = 'rgba(180,83,9,.28)'; ctx.fill(); }
                    BENTUK[jenis].forEach(([a, dx, dy]) => U.atom(ctx, a, dx, dy));
                    ctx.restore();
                },
                // Panel gelap berisi baris teks; tiap baris = [[teks, warna], ...]
                panel(ctx, baris, x, y, ekstra) {
                    const uk = U.uk(11.5), tinggiBaris = uk + 6;
                    ctx.font = U.huruf(uk, 800);
                    const lebar = Math.max(...baris.map(b => b.reduce((s, [t]) => s + ctx.measureText(t).width, 0)));
                    const w = lebar + 20, h = baris.length * tinggiBaris + 12 + (ekstra || 0);
                    U.kotak(ctx, x, y, w, h, 10); ctx.fillStyle = 'rgba(15,23,42,.86)'; ctx.fill();
                    ctx.textBaseline = 'middle'; ctx.textAlign = 'left';
                    baris.forEach((b, i) => {
                        let cx = x + 10; const cy = y + 6 + tinggiBaris * i + tinggiBaris / 2;
                        b.forEach(([t, warna]) => { ctx.fillStyle = warna || '#fff'; ctx.fillText(t, cx, cy); cx += ctx.measureText(t).width; });
                    });
                    return { x, y, w, h, bawah: y + baris.length * tinggiBaris + 6 };
                },
                // Keterangan simbol di bagian bawah adegan; item = [jenis, label panjang, label pendek]
                legenda(ctx, item, y) {
                    const uk = U.uk(11), sk = Math.min(1.25, .9 * U.ts);
                    U.kotak(ctx, 8, y - 17, W - 16, 34, 12);
                    ctx.fillStyle = 'rgba(255,255,255,.93)'; ctx.fill();
                    ctx.font = U.huruf(uk, 700);
                    const ikon = 34 * sk, jarak = 18;
                    let pakai = 1, lebar = item.map(it => ikon + ctx.measureText(it[1]).width);
                    let total = lebar.reduce((a, b) => a + b, 0) + jarak * (item.length - 1);
                    if (total > W - 36) {
                        pakai = 2; lebar = item.map(it => ikon + ctx.measureText(it[2] || it[1]).width);
                        total = lebar.reduce((a, b) => a + b, 0) + jarak * (item.length - 1);
                    }
                    const sisa = Math.max(0, (W - 36 - total) / (item.length + 1));
                    let x = 18 + sisa;
                    item.forEach((it, i) => {
                        U.molekul(ctx, it[0], x + ikon / 2 - 4, y, 0, sk);
                        U.teks(ctx, it[pakai] || it[1], x + ikon, y + uk * .36, { ukuran: uk, tebal: 700, warna: '#334155' });
                        x += lebar[i] + jarak + sisa;
                    });
                }
            };

            /* ---------- Markup ---------- */
            function html(it) {
                const a = ADEGAN[it.adegan];
                if (!a) return '';
                const titik = a.langkah.map((l, i) =>
                    `<button type="button" data-i="${i}" aria-label="Adegan ${i + 1}: ${l.pendek || ''}"><i></i></button>`).join('');
                return `<figure class="anim-orientasi layar-saja" data-adegan="${it.adegan}">
                    <div class="anim-kepala"><span class="anim-tag">🎬 ${a.judul}</span><span class="anim-hitung">Adegan 1/${a.langkah.length}</span></div>
                    <div class="anim-layar">
                        <canvas role="img" aria-label="${a.alt}"></canvas>
                        <button type="button" class="anim-mulai"><span class="segitiga" aria-hidden="true"></span>Putar animasi</button>
                    </div>
                    <figcaption class="anim-bawah">
                        <p class="anim-teks" aria-live="polite">${a.langkah[0].teks}</p>
                        <div class="anim-kendali">
                            <div class="anim-titik" role="group" aria-label="Pilih adegan">${titik}</div>
                            <button type="button" class="anim-tombol" data-aksi="putar" aria-label="Putar animasi"><span class="ikn" aria-hidden="true">▶</span><span class="tks">Putar</span></button>
                            <button type="button" class="anim-tombol" data-aksi="ulang" aria-label="Ulangi animasi"><span class="ikn" aria-hidden="true">↺</span><span class="tks">Ulangi</span></button>
                        </div>
                    </figcaption>
                </figure>`;
            }

            /* ---------- Pemutar ---------- */
            function pasang(el) {
                if (el.dataset.terpasang) return;
                const a = ADEGAN[el.dataset.adegan];
                if (!a) return;
                el.dataset.terpasang = '1';
                const cv = el.querySelector('canvas'), ctx = cv.getContext('2d');
                const teksEl = el.querySelector('.anim-teks'), hitungEl = el.querySelector('.anim-hitung');
                const titikEl = Array.from(el.querySelectorAll('.anim-titik button'));
                const tPutar = el.querySelector('[data-aksi="putar"]'), tUlang = el.querySelector('[data-aksi="ulang"]');
                const tMulai = el.querySelector('.anim-mulai');

                const awal = []; let total = 0;
                a.langkah.forEach(l => { awal.push(total); total += l.durasi; });
                let st = null, t = 0, main = false, terlihat = false, pernahMain = false, idx = -1, sebelum = 0, skala = 1, ts = 1;
                const info = { t: 0, langkah: 0, lokal: 0, p: 0, selesai: false };

                function hitungInfo() {
                    let i = 0;
                    for (let k = 0; k < awal.length; k++) if (t >= awal[k]) i = k;
                    info.t = t; info.langkah = i; info.lokal = t - awal[i];
                    info.p = Math.min(1, info.lokal / a.langkah[i].durasi);
                    info.selesai = t >= total;
                }
                function reset() { st = a.buat(acak(a.benih || 7)); t = 0; hitungInfo(); }
                function maju(dt) { t += dt; hitungInfo(); a.perbarui(st, dt, info); }
                function gambar() {
                    if (!st || !cv.width) return;
                    ctx.setTransform(skala, 0, 0, skala, 0, 0);
                    ctx.clearRect(0, 0, W, H);
                    U.ts = ts;
                    a.gambar(ctx, st, info, U);
                }
                function segarkanUI() {
                    if (info.langkah !== idx) {
                        idx = info.langkah;
                        teksEl.innerHTML = a.langkah[idx].teks;
                        hitungEl.textContent = `Adegan ${idx + 1}/${a.langkah.length}`;
                        titikEl.forEach((b, i) => {
                            b.classList.toggle('aktif', i === idx);
                            b.classList.toggle('lewat', i < idx);
                            if (i === idx) b.setAttribute('aria-current', 'step'); else b.removeAttribute('aria-current');
                        });
                    }
                    const b = titikEl[idx];
                    if (b) b.firstElementChild.style.width = (info.p * 100).toFixed(1) + '%';
                    el.classList.toggle('tamat', info.selesai);
                }
                function lompat(target) {
                    reset();
                    while (t < target) maju(1 / 30);
                    segarkanUI(); gambar();
                }
                function aturMain(v) {
                    main = v;
                    tPutar.querySelector('.ikn').textContent = v ? '❚❚' : '▶';
                    tPutar.querySelector('.tks').textContent = v ? 'Jeda' : 'Putar';
                    tPutar.setAttribute('aria-label', v ? 'Jeda animasi' : 'Putar animasi');
                    el.classList.toggle('berjalan', v);
                    if (v) { pernahMain = true; tMulai.hidden = true; }
                }
                function ukur() {
                    const w = cv.clientWidth;
                    if (!w) return;
                    const dpr = Math.min(2, window.devicePixelRatio || 1);
                    cv.width = Math.round(w * dpr);
                    cv.height = Math.round(w * H / W * dpr);
                    skala = cv.width / W;
                    ts = Math.max(1, Math.min(1.5, 470 / w));
                    gambar();
                }
                function putaran(now) {
                    const dt = sebelum ? Math.min(0.05, (now - sebelum) / 1000) : 0;
                    sebelum = now;
                    if (main && terlihat && dt > 0) { maju(dt); gambar(); segarkanUI(); }
                    requestAnimationFrame(putaran);
                }

                tMulai.addEventListener('click', () => { if (info.selesai) lompat(0); aturMain(true); });
                tPutar.addEventListener('click', () => { if (!main && info.selesai) lompat(0); aturMain(!main); });
                tUlang.addEventListener('click', () => { lompat(0); aturMain(true); });
                titikEl.forEach((b, i) => b.addEventListener('click', () => {
                    lompat(awal[i] + 0.001);
                    aturMain(!kurangiGerak);
                    if (kurangiGerak) tMulai.hidden = true;
                }));

                reset(); segarkanUI();
                if ('ResizeObserver' in window) new ResizeObserver(ukur).observe(cv); else window.addEventListener('resize', ukur);
                ukur();
                if (document.fonts && document.fonts.ready) document.fonts.ready.then(gambar);

                if ('IntersectionObserver' in window) {
                    new IntersectionObserver(ent => ent.forEach(e => {
                        terlihat = e.isIntersecting;
                        if (terlihat && !pernahMain && !kurangiGerak) aturMain(true);
                    }), { threshold: 0.35 }).observe(el);
                } else { terlihat = true; if (!kurangiGerak) aturMain(true); }
                requestAnimationFrame(putaran);
            }

            function pasangSemua() { document.querySelectorAll('.anim-orientasi').forEach(pasang); }
            document.addEventListener('DOMContentLoaded', () => {
                pasangSemua();
                const isi = document.getElementById('isiLkpd');
                if (isi && 'MutationObserver' in window) new MutationObserver(pasangSemua).observe(isi, { childList: true, subtree: true });
            });

            window.AnimasiOrientasi = { html, U, daftar: (nama, def) => { ADEGAN[nama] = def; } };
        })();
    </script>
    <script>
        /* Adegan: emisi NO kendaraan membentuk NO₂ (LKPD Persamaan Laju & Orde Reaksi) */
        (function () {
            const AO = window.AnimasiOrientasi;
            const LANGIT = 192, LAJUR = [216, 242], LAMPU_X = 446, BERHENTI = 420;
            const WARNA = ['#ef4444', '#f59e0b', '#10b981', '#3b82f6', '#8b5cf6', '#ec4899', '#14b8a6', '#f97316', '#64748b', '#0ea5e9'];

            function mobil(r, x, lajur, v) {
                return { x, lajur, v, warna: WARNA[Math.floor(r() * WARNA.length)], emisi: r() * .8, truk: r() < .18 };
            }
            function gerakAcak(r, m, dt, kec) {
                m.vx += (r() - .5) * 60 * dt; m.vy += (r() - .5) * 60 * dt;
                const v = Math.hypot(m.vx, m.vy) || 1; m.vx = m.vx / v * kec; m.vy = m.vy / v * kec;
                m.x += m.vx * dt; m.y += m.vy * dt; m.rot += m.vr * dt;
                if (m.x < 12) { m.x = 12; m.vx = Math.abs(m.vx); } if (m.x > 468) { m.x = 468; m.vx = -Math.abs(m.vx); }
                if (m.y < 64) { m.y = 64; m.vy = Math.abs(m.vy); } if (m.y > LANGIT - 8) { m.y = LANGIT - 8; m.vy = -Math.abs(m.vy); }
            }

            AO.daftar('emisi', {
                judul: 'Animasi permasalahan: emisi kendaraan dan gas NO₂',
                alt: 'Animasi jalan raya. Knalpot kendaraan melepaskan gas NO yang bereaksi dengan oksigen membentuk gas NO₂ berwarna cokelat. Saat macet, jumlah NO naik tiga kali dan kabut cokelat terbentuk lebih cepat.',
                benih: 37,
                langkah: [
                    { durasi: 5, pendek: 'lalu lintas lancar', teks: 'Lalu lintas lancar. Knalpot kendaraan melepaskan gas <strong>NO</strong> ke udara.' },
                    { durasi: 6, pendek: 'reaksi', teks: 'Di udara, NO bereaksi dengan O₂ membentuk <strong>NO₂</strong> yang berwarna cokelat: 2NO(g) + O₂(g) → 2NO₂(g).' },
                    { durasi: 5, pendek: 'macet', teks: 'Lampu merah dan kemacetan! Kendaraan berderet dan mesinnya tetap menyala. Konsentrasi NO di udara naik <strong>3 kali lipat</strong>.' },
                    { durasi: 6, pendek: 'makin cepat', teks: 'Kabut cokelat NO₂ terbentuk makin cepat. Tetapi seberapa cepat: <strong>3 kali, 6 kali, atau 9 kali lipat?</strong>' },
                    { durasi: 6, pendek: 'pertanyaan', teks: '<strong>Tentukan persamaan laju reaksi dari data percobaan</strong> agar kamu dapat memprediksi laju pembentukan NO₂ saat macet.' }
                ],

                buat(r) {
                    const st = { r, mobil: [], no: [], o2: [], no2: [], efek: [], kabut: 0, laju: 0, akum: 0, waktu: 0, macet: false, gedung: [] };
                    st.mobil.push(mobil(r, 40, 0, 72), mobil(r, 250, 1, 64), mobil(r, 390, 0, 70));
                    for (let i = 0; i < 12; i++) st.o2.push({ x: 20 + r() * 440, y: 70 + r() * 110, vx: 0, vy: 0, rot: r() * 6, vr: (r() - .5) * 2 });
                    let x = -6;
                    while (x < 490) { const w = 34 + r() * 40, h = 50 + r() * 80; st.gedung.push({ x, w, h, jendela: r() }); x += w + 4 + r() * 10; }
                    return st;
                },

                perbarui(st, dt, info) {
                    const r = st.r, L = info.langkah;
                    st.waktu += dt;
                    st.macet = L >= 2;

                    // Mobil
                    if (st.macet) {
                        [0, 1].forEach(la => {
                            const baris = st.mobil.filter(m => m.lajur === la).sort((a, b) => a.x - b.x);
                            const akhir = baris[0];
                            if (baris.length < 5 && (!akhir || akhir.x > 40)) st.mobil.push(mobil(r, -40, la, 60));
                        });
                    }
                    [0, 1].forEach(la => {
                        const baris = st.mobil.filter(m => m.lajur === la).sort((a, b) => b.x - a.x);
                        baris.forEach((m, i) => {
                            let target = 70;
                            if (st.macet) {
                                const depan = i === 0 ? (m.x < BERHENTI + 4 ? BERHENTI + 30 : 1e9) : baris[i - 1].x;
                                target = Math.max(0, Math.min(70, (depan - m.x - 56) * 2.2));
                            }
                            m.v += (target - m.v) * Math.min(1, dt * 3);
                            m.x += m.v * dt;
                        });
                    });
                    st.mobil = st.mobil.filter(m => st.macet ? m.x < 540 : true);
                    if (!st.macet) st.mobil.forEach(m => { if (m.x > 520) m.x = -50; });

                    // Emisi NO dari knalpot
                    st.mobil.forEach(m => {
                        if (m.x < -20 || m.x > 500) return;
                        m.emisi -= dt;
                        if (m.emisi <= 0) {
                            m.emisi = .75 + r() * .4;
                            const ex = m.x - 25, ey = LAJUR[m.lajur] + 3;
                            st.efek.push({ jenis: 'asap', x: ex, y: ey, t: 0 });
                            if (st.no.length < 42) st.no.push({ x: ex, y: ey - 6, vx: -10, vy: -45, rot: r() * 6, vr: (r() - .5) * 2, naik: 1 });
                        }
                    });

                    // Gerak molekul
                    st.no.forEach(m => {
                        if (m.naik > 0) { m.naik -= dt * .7; m.x += m.vx * dt; m.y += m.vy * dt; if (m.y < LANGIT - 10) m.naik = 0; }
                        else gerakAcak(r, m, dt, 26);
                    });
                    st.o2.forEach(m => gerakAcak(r, m, dt, 22));
                    st.no2.forEach(m => { m.umur += dt; m.y -= 6 * dt; m.x += Math.sin(st.waktu + m.rot) * 8 * dt; m.rot += dt * .6; });
                    st.no2 = st.no2.filter(m => {
                        if (m.umur > 5.5) { st.kabut = Math.min(.5, st.kabut + .014); return false; }
                        return true;
                    });

                    // Reaksi 2NO + O₂ → 2NO₂ (laju sebanding dengan [NO]²)
                    if (L >= 1) {
                        const bebas = st.no.filter(m => m.naik <= 0);
                        st.akum += 0.0065 * bebas.length * bebas.length * dt;
                        let terjadi = 0;
                        while (st.akum >= 1 && bebas.length >= 2 && st.o2.length) {
                            st.akum -= 1; terjadi++;
                            const a = bebas.splice(Math.floor(r() * bebas.length), 1)[0];
                            let bi = 0, bd = 1e9;
                            bebas.forEach((m, i) => { const d = Math.hypot(m.x - a.x, m.y - a.y); if (d < bd) { bd = d; bi = i; } });
                            const b = bebas.splice(bi, 1)[0];
                            let oi = 0, od = 1e9;
                            st.o2.forEach((m, i) => { const d = Math.hypot(m.x - a.x, m.y - a.y); if (d < od) { od = d; oi = i; } });
                            st.o2.splice(oi, 1);
                            st.no = st.no.filter(m => m !== a && m !== b);
                            st.no2.push({ x: a.x, y: a.y, rot: r() * 6, umur: 0 }, { x: b.x, y: b.y, rot: r() * 6, umur: 0 });
                            st.efek.push({ jenis: 'reaksi', x: (a.x + b.x) / 2, y: (a.y + b.y) / 2, t: 0 });
                        }
                        if (st.akum > 3) st.akum = 3;

                    ctx.fillStyle = '#e2e8f0'; for (let x = BERHENTI + 20; x < BERHENTI + 44; x += 6) ctx.fillRect(x, LANGIT + 10, 3, 58);

                    // Lampu lalu lintas
                    ctx.fillStyle = '#1f2937'; ctx.fillRect(LAMPU_X + 12, 120, 4, 76);

                    const merah = st.macet;
                    [[108, '#ef4444', merah], [118, '#facc15', false], [128, '#22c55e', !merah]].forEach(([y, w, nyala]) => {
                        ctx.fillStyle = nyala ? w : 'rgba(148,163,184,.35)'; ctx.beginPath(); ctx.arc(LAMPU_X + 14, y, 4, 0, 6.3); ctx.fill();
                    });

                    // Asap knalpot
                    st.efek.forEach(e => {
                        if (e.jenis === 'asap') {
                            ctx.fillStyle = `rgba(148,163,184,${.45 * (1 - e.t)})`;
                            ctx.beginPath(); ctx.arc(e.x - e.t * 14, e.y - e.t * 10, 4 + e.t * 9, 0, 6.3); ctx.fill();
                        }
                    });

                    // Kendaraan
                    st.mobil.slice().sort((a, b) => a.lajur - b.lajur).forEach(m => gambarMobil(ctx, U, m.x, LAJUR[m.lajur], m.warna, m.truk));

                    // Molekul
                    st.o2.forEach(m => U.molekul(ctx, 'O2', m.x, m.y, m.rot, .85));
                    st.no.forEach(m => U.molekul(ctx, 'NO', m.x, m.y, m.rot, .9));
                    st.no2.forEach(m => U.molekul(ctx, 'NO2', m.x, m.y, m.rot, .9, Math.min(1, (5.5 - m.umur) / 1.2)));

            function gambarMobil(ctx, U, x, y, warna, truk) {
                ctx.save(); ctx.translate(x, y);

                    ctx.beginPath(); ctx.moveTo(-14, -9); ctx.lineTo(-8, -18); ctx.lineTo(10, -18); ctx.lineTo(17, -9); ctx.closePath(); ctx.fill();
                    ctx.fillStyle = '#bae6fd'; ctx.beginPath(); ctx.moveTo(-10, -10); ctx.lineTo(-6, -16); ctx.lineTo(2, -16); ctx.lineTo(2, -10); ctx.closePath(); ctx.fill();

                ctx.beginPath(); ctx.arc(-14, 3, 5, 0, 6.3); ctx.arc(14, 3, 5, 0, 6.3); ctx.fill();
                ctx.fillStyle = '#9ca3af'; ctx.beginPath(); ctx.arc(-14, 3, 2, 0, 6.3); ctx.arc(14, 3, 2, 0, 6.3); ctx.fill();

        /* =====================================================================

        }

        function labelSoal(it) {
            const chip = [
                it.tp ? `<span class="chip tp">${esc(it.tp)}</span>` : '',
                it.opsional ? `<span class="chip opsional">${esc(it.opsional === true ? 'Tantangan · opsional' : it.opsional)}</span>` : ''
