        }

        function labelSoal(it) {
            const chip = [
                it.tp ? `<span class="chip tp">${esc(it.tp)}</span>` : '',
                it.opsional ? `<span class="chip opsional">${esc(it.opsional === true ? 'Tantangan · opsional' : it.opsional)}</span>` : ''
            ].join('');
            return `<div class="tanya"><span class="nomor">${it.nomor}</span><div><div class="teks-tanya">${it.label}${chip}</div>${it.ket ? `<div style="font-size:.85rem;color:var(--redup);margin-top:2px">${it.ket}</div>` : ''}</div></div>`;
        }

        function renderBlok(it) {
            const levelAttr = it.level ? ` data-level="${esc(it.level)}"` : '';
            switch (it.tipe) {
                case 'animasi':
                    return window.AnimasiOrientasi ? window.AnimasiOrientasi.html(it) : '';
                case 'info':
                    return `<div class="info ${it.gaya || ''}"${levelAttr}>${it.tag ? `<div class="tag">${it.tag}</div>` : ''}${it.html}</div>`;
                case 'bantuan':
                    return `<details class="bantuan"${levelAttr}><summary>${esc(it.judul || 'Kartu bantuan')}</summary><div class="isi">${it.html}</div></details>`;
                case 'tautan':
                    return `<div class="tautan-daftar">${it.item.map(t => `<a href="${esc(t.href)}" target="_blank" rel="noopener"><strong>${t.label} ↗</strong><span>${t.ket}</span></a>`).join('')}</div>`;
                case 'datalab':
                    return `<div class="data-lab" data-lab="${esc(it.lab)}"><strong>📡 Data dari laboratorium virtual (${esc(it.nama)})</strong><div class="isi-lab">Masuk ke akunmu agar data percobaanmu tampil di sini.</div></div>`;
            }
            let jawab = '';
            const q = it.id;
            if (it.tipe === 'uraian') {
                jawab = `<textarea data-q="${q}" rows="${it.baris || 4}" placeholder="${esc(it.placeholder || 'Tulis jawabanmu di sini…')}"></textarea><div class="nilai-cetak" data-cetak="${q}"></div>`;
            } else if (it.tipe === 'isian') {
                jawab = `<input type="text" data-q="${q}" placeholder="${esc(it.placeholder || '')}" ${it.lebar ? `style="max-width:${it.lebar}"` : ''}>`;
            } else if (it.tipe === 'pilihan') {
                jawab = `<div class="pilihan-daftar" role="radiogroup">${it.opsi.map((o, i) => `<label><input type="radio" name="${q}" data-q="${q}" data-k="pilih" value="${esc(o)}"><span>${o}</span></label>`).join('')}</div>` +
                    (it.alasan ? `<textarea data-q="${q}" data-k="alasan" rows="3" style="margin-top:8px" placeholder="Tuliskan alasanmu…"></textarea><div class="nilai-cetak" data-cetak="${q}.alasan"></div>` : '');
            } else if (it.tipe === 'tabel') {
                jawab = `<div class="tabel-wadah"><table class="lkpd"><thead><tr><th>${esc(it.kepala || '')}</th>${it.kolom.map(k => `<th>${esc(k.judul)}</th>`).join('')}</tr></thead><tbody>
                    ${it.baris.map((br, r) => `<tr><td>${br}</td>${it.kolom.map((k, c) => `<td>${sel(q, `r${r}c${c}`, k)}</td>`).join('')}</tr>`).join('')}
                    </tbody></table></div>` + (it.grafik ? `<div class="grafik" data-grafik="${q}"><div class="jdl">📊 Grafik otomatis: ${esc(it.grafik.judul)}</div><div class="svg"></div></div>` : '');
            } else if (it.tipe === 'bs') {
                jawab = `<div class="tabel-wadah"><table class="lkpd"><thead><tr><th>Pernyataan</th><th style="width:130px">Benar/Salah</th><th>Alasan</th></tr></thead><tbody>
                    ${it.pernyataan.map((p, r) => `<tr><td style="white-space:normal;font-weight:600">${p}</td><td>${sel(q, `r${r}bs`, { tipe: 'pilih', opsi: ['Benar', 'Salah'] })}</td><td>${sel(q, `r${r}al`, { tipe: 'teks', ph: 'alasan singkat' })}</td></tr>`).join('')}
                    </tbody></table></div>`;
            } else if (it.tipe === 'diagram') {
                jawab = `<div class="diagram">${it.svg}</div><div class="penanda-daftar">${it.penanda.map((p, r) => `<label><span class="bulat">${p}</span>${sel(q, `p${r}`, { tipe: 'pilih', opsi: it.opsi })}</label>`).join('')}</div>`;
            }
            return `<div class="soal" data-soal="${q}"${levelAttr}>${labelSoal(it)}<div class="jawab">${jawab}</div><div class="catatan-guru" data-catatan="${q}" hidden></div></div>`;
        }

        function sel(q, k, kol) {
            if (kol.tipe === 'pilih') return `<select data-q="${q}" data-k="${k}" aria-label="${esc(kol.judul || k)}"><option value="">– pilih –</option>${kol.opsi.map(o => `<option>${esc(o)}</option>`).join('')}</select>`;
            return `<input type="${kol.tipe === 'angka' ? 'text' : 'text'}" ${kol.tipe === 'angka' ? 'inputmode="decimal"' : ''} data-q="${q}" data-k="${k}" placeholder="${esc(kol.ph || '')}" aria-label="${esc(kol.judul || k)}">`;
        }

        /* =====================================================================
           NILAI ISIAN <-> TAMPILAN
           ===================================================================== */
        function ambilDariForm(el) {
            const q = el.dataset.q, k = el.dataset.k;
            if (el.type === 'radio') {
                if (!el.checked) return;
                S.isian[q] = Object.assign({}, typeof S.isian[q] === 'object' ? S.isian[q] : {}, { pilih: el.value });
            } else if (k) {
                S.isian[q] = Object.assign({}, typeof S.isian[q] === 'object' ? S.isian[q] : {}, { [k]: el.value });
            } else {
                S.isian[q] = el.value;
            }
        }

        function isiKeForm() {
            document.querySelectorAll('[data-q]').forEach(el => {
                const q = el.dataset.q, k = el.dataset.k, v = S.isian[q];
                if (v == null) return;
                if (el.type === 'radio') el.checked = typeof v === 'object' && v.pilih === el.value;
                else if (k) el.value = (typeof v === 'object' && v[k]) || '';
                else el.value = typeof v === 'string' ? v : '';
            });
            document.querySelectorAll('[data-idn]').forEach(el => { el.value = S.identitas[el.dataset.idn] || ''; });
            perbaruiTampilanTurunan();
        }

        // Teks jawaban yang mudah dibaca guru di dashboard
        function teksJawaban(it) {
            const v = S.isian[it.id];
            if (v == null || v === '') return '';
            if (typeof v === 'string') return v.trim();
            if (it.tipe === 'pilihan') return [v.pilih ? `Pilihan: ${v.pilih}` : '', v.alasan ? `Alasan: ${v.alasan}` : ''].filter(Boolean).join('\n');
            if (it.tipe === 'tabel') return it.baris.map((br, r) => {
                const isi = it.kolom.map((k, c) => v[`r${r}c${c}`] ? `${k.judul}: ${v[`r${r}c${c}`]}` : '').filter(Boolean).join('; ');
                return isi ? `${br.replace(/<[^>]+>/g, '')} → ${isi}` : '';
            }).filter(Boolean).join('\n');
            if (it.tipe === 'bs') return it.pernyataan.map((p, r) => {
                const bs = v[`r${r}bs`], al = v[`r${r}al`];
                return bs || al ? `${r + 1}. ${p.replace(/<[^>]+>/g, '')} → ${bs || '-'}${al ? ` (alasan: ${al})` : ''}` : '';
            }).filter(Boolean).join('\n');
            if (it.tipe === 'diagram') return it.penanda.map((p, r) => v[`p${r}`] ? `Penanda ${p}: ${v[`p${r}`]}` : '').filter(Boolean).join('\n');
            return JSON.stringify(v);
        }

        function sudahTerisi(it) {
            const v = S.isian[it.id];
            if (v == null) return false;
            if (typeof v === 'string') return v.trim().length > 0;
            if (it.tipe === 'pilihan') return !!v.pilih && (!it.alasan || !!(v.alasan || '').trim());
            if (it.tipe === 'tabel') {
                const total = it.baris.length * it.kolom.length;
                const isi = Object.values(v).filter(x => String(x).trim()).length;
                return isi >= Math.ceil(total * 0.6);
            }
            if (it.tipe === 'bs') return it.pernyataan.every((_, r) => v[`r${r}bs`]);
            if (it.tipe === 'diagram') return it.penanda.every((_, r) => v[`p${r}`]);
            return false;
        }

        const levelDipilih = () => (S.isian.level && S.isian.level.pilih) || null;
        function soalAktif(it) { return !it.level || it.level === levelDipilih(); }
        function soalWajib() { return SOAL.filter(it => !it.opsional && soalAktif(it) && !it.tidakWajib); }

        function perbaruiTampilanTurunan() {
            // Tampilkan soal sesuai level yang dipilih
            const lv = levelDipilih();
            document.querySelectorAll('[data-level]').forEach(el => { el.hidden = el.dataset.level !== lv; });
            document.querySelectorAll('.pesan-level').forEach(el => { el.hidden = !!lv; });
            // Tanda terisi & progres
            SOAL.forEach(it => { const el = document.querySelector(`[data-soal="${it.id}"]`); if (el) el.classList.toggle('terisi', sudahTerisi(it)); });
            const wajib = soalWajib(), terisi = wajib.filter(sudahTerisi).length;
            $('#barProgres').style.width = (wajib.length ? terisi / wajib.length * 100 : 0) + '%';
            L.bagian.forEach((b, bi) => {
                const daftar = b.blok.filter(it => it.id && !it.opsional && soalAktif(it));
                const a = document.querySelector(`.langkah a[data-fase="${bi}"]`);
                if (a) a.classList.toggle('lengkap', daftar.length > 0 && daftar.every(sudahTerisi));
            });
            // Grafik otomatis
            SOAL.filter(it => it.grafik).forEach(gambarGrafik);
            // Salinan untuk cetak
            document.querySelectorAll('[data-cetak]').forEach(d => {
                const [q, k] = d.dataset.cetak.split('.');
                const v = S.isian[q];
                d.textContent = k ? ((v && v[k]) || '') : (typeof v === 'string' ? v : '');
            });
            document.querySelectorAll('[data-cetak-idn]').forEach(d => { d.textContent = S.identitas[d.dataset.cetakIdn] || ''; });
        }

        function angka(s) { const n = parseFloat(String(s || '').replace(',', '.').replace(/[^\d.eE+-]/g, '')); return isFinite(n) ? n : null; }

        function gambarGrafik(it) {
            const wadah = document.querySelector(`[data-grafik="${it.id}"] .svg`);
            if (!wadah) return;
            const v = S.isian[it.id] || {};
            const c = it.grafik.kolom;
            const data = it.baris.map((br, r) => ({ label: br.replace(/<[^>]+>/g, ''), n: angka(v[`r${r}c${c}`]) }));
            const maks = Math.max(0, ...data.map(d => d.n || 0));
            if (!maks) { wadah.innerHTML = `<p style="margin:4px 0;font-size:.82rem;color:var(--redup)">Isi kolom "${esc(it.kolom[c].judul)}" untuk melihat grafik.</p>`; return; }
            const W = 520, H = 40 + data.length * 34, kiri = 130, kanan = 60;
            const batang = data.map((d, i) => {
                const y = 18 + i * 34, w = d.n ? (W - kiri - kanan) * d.n / maks : 0;
                return `<text x="${kiri - 8}" y="${y + 15}" text-anchor="end" font-size="12" font-weight="700" fill="#334155">${esc(d.label.length > 18 ? d.label.slice(0, 17) + '…' : d.label)}</text>
                    <rect x="${kiri}" y="${y}" width="${w}" height="22" rx="6" fill="var(--aksen)" opacity="${.55 + .45 * (i + 1) / data.length}"/>
                    <text x="${kiri + w + 6}" y="${y + 15}" font-size="12" font-weight="800" fill="#0f172a">${d.n == null ? '' : String(d.n).replace('.', ',')} ${esc(it.grafik.satuan)}</text>`;
            }).join('');
            wadah.innerHTML = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(it.grafik.judul)}">${batang}<line x1="${kiri}" y1="10" x2="${kiri}" y2="${H - 12}" stroke="#94a3b8"/></svg>`;
        }

        /* =====================================================================
           SIMPAN OTOMATIS
           ===================================================================== */
        const kunciLokal = () => `lkpd:${L.id}:${S.uid || 'tamu'}`;
        let timerSimpan = null;

        function infoSimpan(kelas, teks) {
            const el = $('#simpanInfo');
            el.className = 'simpan-info ' + kelas;
            el.lastElementChild.textContent = teks;
        }
        const jam = () => new Date().toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' });

        function simpanLokal() {
            if (typeof MODE_PERIKSA !== 'undefined' && MODE_PERIKSA) return;
            try { localStorage.setItem(kunciLokal(), JSON.stringify({ isian: S.isian, identitas: S.identitas, diperbarui: Date.now() })); } catch (e) { }
        }

        function jadwalkanSimpan() {
            if (S.terkunci) return;
            simpanLokal();
            infoSimpan('proses', 'Menyimpan…');
            clearTimeout(timerSimpan);
            timerSimpan = setTimeout(simpanCloud, 1800);
        }

        function paketData() {
            const jawaban = {}, soalMeta = {}, faseMeta = {};
            SOAL.forEach(it => {
                const t = teksJawaban(it);
                if (t) jawaban[it.id] = t;
                soalMeta[it.id] = (it.label || '').replace(/<[^>]+>/g, '');
                faseMeta[it.id] = it.fase;
            });
            const wajib = soalWajib();
            return {
                judul: L.judul, pertemuan: L.pertemuan, nama: S.identitas.nama || S.nama || '',
                kelas: S.identitas.kelas || '', identitas: S.identitas,
                jawaban, isian: S.isian, soal: soalMeta, fase: faseMeta,
                progres: Math.round(wajib.filter(sudahTerisi).length / Math.max(1, wajib.length) * 100),
                diperbarui: Date.now()
            };
        }

        async function simpanCloud() {
            if (S.terkunci) return;
            if (!S.cloud || !S.uid) { infoSimpan('lokal', `Tersimpan di perangkat ${jam()}`); return; }
            try {
                const { ref, update } = S.fb;
                const status = S.status === 'revisi' ? 'revisi' : 'draf';
                await update(ref(S.db, `lkpd/${S.uid}/${L.id}`), Object.assign(paketData(), { status }));
                infoSimpan('ok', `Tersimpan otomatis ${jam()}`);
            } catch (e) {
                console.warn(e);
                infoSimpan('galat', 'Gagal ke server, tersimpan di perangkat');
            }
        }

        /* =====================================================================
           STATUS DARI GURU (draf / dikumpulkan / revisi / dinilai)
           ===================================================================== */
        function terapkanStatus(rec) {
            S.rekam = rec || null;
            S.status = (rec && rec.status) || 'draf';
            S.terkunci = S.status === 'dikumpulkan' || S.status === 'dinilai';
            document.querySelectorAll('[data-q], [data-idn]').forEach(el => el.disabled = S.terkunci);
            ['#tombolKirim', '#tombolKirimAtas'].forEach(id => { const b = $(id); if (b) b.disabled = S.terkunci; });
            const sp = $('#spandukStatus');
            const cs = (rec && rec.catatanSoal) || {};
            document.querySelectorAll('[data-catatan]').forEach(el => {
                const t = S.status === 'revisi' || S.status === 'dinilai' ? cs[el.dataset.catatan] : '';
                el.hidden = !t; el.textContent = t || '';
            });
            const tgl = t => t ? new Date(t).toLocaleString('id-ID', { dateStyle: 'medium', timeStyle: 'short' }) : '';
            if (S.status === 'dinilai') {
                sp.innerHTML = `<div class="spanduk hijau"><div class="nilai-besar">${esc(rec.nilai ?? '-')}</div><div><strong>LKPD sudah dinilai guru.</strong>${rec.catatanGuru ? `<br>${esc(rec.catatanGuru)}` : ''}<br><small>${tgl(rec.dinilaiPada)}</small></div></div>`;
                infoSimpan('ok', 'Sudah dinilai');
            } else if (S.status === 'dikumpulkan') {
                sp.innerHTML = `<div class="spanduk biru">📤 <div><strong>LKPD sudah dikumpulkan</strong> ${tgl(rec.dikumpulkanPada)}. Jawaban dikunci sambil menunggu penilaian guru. Kamu tetap bisa mencetaknya.</div></div>`;
                infoSimpan('ok', 'Terkumpul');
            } else if (S.status === 'revisi') {
                sp.innerHTML = `<div class="spanduk kuning">✏️ <div><strong>Guru meminta revisi.</strong>${rec.catatanGuru ? `<br>${esc(rec.catatanGuru)}` : ''}<br>Perbaiki jawaban yang diberi catatan, lalu kumpulkan lagi.</div></div>`;
            } else sp.innerHTML = '';
        }

        /* =====================================================================
           KUMPULKAN
           ===================================================================== */
        function modal(judul, isiHtml, aksi) {
            $('#modalJudul').textContent = judul;
            $('#modalIsi').innerHTML = isiHtml;
            $('#modalAksi').innerHTML = '';
            aksi.forEach(a => {
                const b = document.createElement('button');
                b.type = 'button'; b.className = 'tombol' + (a.utama ? ' utama' : ''); b.textContent = a.teks;
                b.addEventListener('click', () => { $('#modal').hidden = true; a.aksi && a.aksi(); });
                $('#modalAksi').appendChild(b);
            });
            $('#modal').hidden = false;
            $('#modalAksi').lastElementChild.focus();
        }

        function mintaKumpulkan() {
            if (S.terkunci) return;
            if (!(S.identitas.nama || '').trim()) {
                toast('Isi nama lengkap dulu.');
                const el = document.querySelector('[data-idn="nama"]'); el.classList.add('salah-isi'); el.focus(); return;
            }
            const kosong = soalWajib().filter(it => !sudahTerisi(it));
            if (kosong.length) {
                modal('Masih ada soal yang belum lengkap', `<p>Lengkapi dulu soal berikut:</p><ul>${kosong.map(it => `<li>Soal ${it.nomor} (${esc(it.fase)})</li>`).join('')}</ul>`, [
                    { teks: 'Kumpulkan saja', aksi: () => kumpulkan() },
                    { teks: 'Lengkapi', utama: true, aksi: () => { const el = document.querySelector(`[data-soal="${kosong[0].id}"]`); el.scrollIntoView({ block: 'center' }); const f = el.querySelector('[data-q]'); if (f) f.focus({ preventScroll: true }); } }
                ]);
                return;
            }
            modal('Kumpulkan LKPD?', '<p>Setelah dikumpulkan, jawaban dikunci sampai guru menilai atau meminta revisi.</p>', [
                { teks: 'Batal' }, { teks: 'Ya, kumpulkan', utama: true, aksi: kumpulkan }
            ]);
        }

        async function kumpulkan() {
            simpanLokal();
            if (!S.cloud || !S.uid) {
                modal('Belum terhubung ke server', `<p>LKPD belum bisa dikirim karena kamu belum masuk atau koneksi terputus. Jawabanmu aman tersimpan di perangkat ini.</p><p><a href="loging.html" target="_top">Masuk ke akun</a>, lalu buka LKPD ini lagi dan tekan Kumpulkan.</p>`, [{ teks: 'Mengerti', utama: true }]);
                return;
            }
            try {
                const { ref, update, push, serverTimestamp } = S.fb;
                infoSimpan('proses', 'Mengirim…');
                await update(ref(S.db, `lkpd/${S.uid}/${L.id}`), Object.assign(paketData(), { status: 'dikumpulkan', dikumpulkanPada: serverTimestamp() }));
                push(ref(S.db, 'aktivitas'), { uid: S.uid, jenis: 'lkpd', pesan: `${S.identitas.nama || S.nama} mengumpulkan ${L.judul}`, waktu: serverTimestamp() }).catch(() => { });
                toast('LKPD terkirim ke dashboard guru 🎉');
            } catch (e) {
                console.error(e);
                infoSimpan('galat', 'Gagal mengirim');
                modal('Gagal mengirim', `<p>Terjadi kesalahan (${esc(e.code || e.message)}). Periksa koneksi internet lalu coba lagi. Jawabanmu tetap tersimpan.</p>`, [{ teks: 'Tutup', utama: true }]);
            }
        }

        /* =====================================================================
           CETAK / PDF
           ===================================================================== */
        function cetak() {
            perbaruiTampilanTurunan();
            $('#tanggalCetak').textContent = new Date().toLocaleString('id-ID', { dateStyle: 'long', timeStyle: 'short' });
            document.querySelectorAll('details.bantuan').forEach(d => d.dataset.buka = d.open);
            const judulAsli = document.title;
            document.title = `${L.judul} - ${S.identitas.nama || 'Siswa'}`;
            window.print();
            setTimeout(() => { document.title = judulAsli; }, 500);
        }
        window.addEventListener('beforeprint', perbaruiTampilanTurunan);

        function toast(t) {
            const el = $('#toast'); el.textContent = t; el.classList.add('tampil');
            clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove('tampil'), 2800);
        }

        /* =====================================================================
           DATA LAB (referensi untuk LKPD praktikum)
           ===================================================================== */
        function pasangDataLab() {
            document.querySelectorAll('[data-lab]').forEach(box => {
                const { ref, onValue } = S.fb;
                onValue(ref(S.db, `lab/${S.uid}/${box.dataset.lab}`), snap => {
                    const d = snap.val(), isi = box.querySelector('.isi-lab');
                    const p = d && d.percobaan ? Object.values(d.percobaan) : [];
                    isi.innerHTML = p.length
                        ? `<ul>${p.map(x => `<li><strong>${esc(x.label || '')}</strong>: ${esc(x.kondisi || '')}${x.waktu != null ? ` · waktu ${esc(String(x.waktu).replace('.', ','))} s` : ''}${x.gas ? ` · gas ${esc(x.gas)}` : ''}</li>`).join('')}</ul>`
                        : 'Belum ada data. Lakukan percobaan di laboratorium virtual; hasilnya akan muncul di sini.';
                });
            });
        }

        /* =====================================================================
           KONEKSI FIREBASE
           ===================================================================== */
        async function sambung() {
            let sesi = {};
            try { sesi = JSON.parse(localStorage.getItem('activeSession') || '{}'); } catch (e) { }
            S.nama = sesi.name || '';
            try {
                const V = '10.12.2';
                const APP = await import(`https://www.gstatic.com/firebasejs/${V}/firebase-app.js`);
                const A = await import(`https://www.gstatic.com/firebasejs/${V}/firebase-auth.js`);
                const D = await import(`https://www.gstatic.com/firebasejs/${V}/firebase-database.js`);
                const app = APP.getApps().length ? APP.getApp() : APP.initializeApp(FIREBASE_CONFIG);
                const auth = A.getAuth(app);
                const user = await new Promise(res => {
                    const batas = setTimeout(() => res(auth.currentUser), 4000);
                    const lepas = A.onAuthStateChanged(auth, u => { clearTimeout(batas); lepas(); res(u); });
                });
                S.uid = (user && user.uid) || sesi.uid || null;
                if (user && user.displayName) S.nama = user.displayName;
                S.db = D.getDatabase(app);
                S.fb = D;
                S.cloud = !!S.uid;
            } catch (e) {
                console.warn('Firebase tidak tersedia, mode perangkat.', e);
                S.uid = sesi.uid || null;
                S.cloud = false;
            }
        }

        async function muat() {
            // 1) Data perangkat
            let lokal = null;
            try { lokal = JSON.parse(localStorage.getItem(kunciLokal()) || 'null'); } catch (e) { }
            // 2) Data server
            let remote = null;
            if (S.cloud) {
                try { remote = (await S.fb.get(S.fb.ref(S.db, `lkpd/${S.uid}/${L.id}`))).val(); } catch (e) { console.warn(e); }
            }
            const pakaiRemote = remote && remote.isian && (!lokal || remote.status !== 'draf' || (remote.diperbarui || 0) >= (lokal.diperbarui || 0));
            const sumber = pakaiRemote ? remote : lokal;
            S.isian = (sumber && sumber.isian) || {};
            S.identitas = (sumber && sumber.identitas) || {};
            if (!S.identitas.nama && S.nama) S.identitas.nama = S.nama;
            isiKeForm();
            terapkanStatus(remote);

            $('#namaBilah').textContent = S.identitas.nama ? `${S.identitas.nama}${S.identitas.kelas ? ' · ' + S.identitas.kelas : ''}` : 'Siswa';
            const sp = $('#spandukMasuk');
            if (!S.cloud) {
                sp.hidden = false;
                sp.innerHTML = `ℹ️ <div>Kamu belum masuk, jadi jawaban hanya tersimpan di perangkat ini. <a href="loging.html" target="_top"><strong>Masuk ke akun</strong></a> agar LKPD bisa dikumpulkan ke guru.</div>`;
                infoSimpan('lokal', 'Tersimpan di perangkat');
            } else {
                if (!S.terkunci) infoSimpan('ok', remote ? 'Tersambung, jawaban dimuat' : 'Tersambung');
                // Pantau perubahan status dari guru secara langsung
                S.fb.onValue(S.fb.ref(S.db, `lkpd/${S.uid}/${L.id}`), snap => {
                    const r = snap.val();
                    const statusLama = S.status;
                    terapkanStatus(r);
                    if (r && r.status !== statusLama && (r.status === 'dinilai' || r.status === 'revisi')) toast(r.status === 'dinilai' ? 'Guru sudah menilai LKPD-mu' : 'Guru meminta revisi');
                });
                pasangDataLab();
                // Sinkronkan jawaban perangkat yang lebih baru ke server
                if (!pakaiRemote && lokal && !S.terkunci) simpanCloud();
            }
        }

        /* =====================================================================
           PENGIKATAN PERISTIWA
           ===================================================================== */
        function ikat() {
            const main = $('#isiLkpd');
            const saatUbah = e => {
                const el = e.target;
                if (el.dataset.q) { ambilDariForm(el); el.classList.remove('salah-isi'); }
                else if (el.dataset.idn) {
                    S.identitas[el.dataset.idn] = el.value; el.classList.remove('salah-isi');
                    $('#namaBilah').textContent = S.identitas.nama || 'Siswa';
                } else return;
                perbaruiTampilanTurunan();
                jadwalkanSimpan();
            };
            main.addEventListener('input', saatUbah);
            main.addEventListener('change', saatUbah);
            $('#tombolKirim').addEventListener('click', mintaKumpulkan);
            $('#tombolKirimAtas').addEventListener('click', mintaKumpulkan);
            $('#tombolCetak').addEventListener('click', cetak);
            $('#tombolCetakBawah').addEventListener('click', cetak);
            $('#modal').addEventListener('click', e => { if (e.target.id === 'modal') $('#modal').hidden = true; });
            document.addEventListener('keydown', e => { if (e.key === 'Escape') $('#modal').hidden = true; });
            window.addEventListener('pagehide', () => { simpanLokal(); });
            document.addEventListener('visibilitychange', () => { if (document.hidden && !S.terkunci) { simpanLokal(); clearTimeout(timerSimpan); simpanCloud(); } });

            // Penanda fase aktif saat menggulir
            const tautan = [...document.querySelectorAll('.langkah a')];
            const perbaruiAktif = () => {
                let aktif = tautan[0];
                tautan.forEach(a => { const s = document.querySelector(a.getAttribute('href')); if (s && s.getBoundingClientRect().top < 180) aktif = a; });
                tautan.forEach(a => a.classList.toggle('aktif', a === aktif));
                const nav = $('#langkahFase');
                if (aktif && !aktif._tengah) { tautan.forEach(a => a._tengah = false); aktif._tengah = true; nav.scrollTo({ left: aktif.offsetLeft - nav.clientWidth / 2 + aktif.offsetWidth / 2, behavior: 'smooth' }); }
            };
            window.addEventListener('scroll', perbaruiAktif, { passive: true });
            perbaruiAktif();
        }

        /* =====================================================================
           MODE PERIKSA GURU
           Dashboard guru membuka file ini dengan ?mode=periksa lalu mengirim
           rekaman LKPD siswa lewat postMessage. Lembar tampil persis seperti
           milik siswa, terkunci, dan tidak menyimpan apa pun.
           ===================================================================== */
        function mulaiModePeriksa() {
            document.body.classList.add('mode-periksa');
            S.terkunci = true;
            render();
            ikat();
            const kunci = () => document.querySelectorAll('[data-q], [data-idn]').forEach(el => el.disabled = true);
            kunci();
            perbaruiTampilanTurunan();
            infoSimpan('ok', 'Mode periksa guru');
            $('#spandukStatus').innerHTML = `<div class="spanduk periksa">🔎 <div>Menunggu data LKPD dari dashboard guru…</div></div>`;
            const asal = location.origin && location.origin !== 'null' ? location.origin : '*';
            const tglLengkap = t => t ? new Date(t).toLocaleString('id-ID', { dateStyle: 'medium', timeStyle: 'short' }) : '–';
            const labelStatus = { draf: 'Draf (belum dikumpulkan)', dikumpulkan: 'Menunggu dinilai', revisi: 'Dikembalikan untuk revisi', dinilai: 'Sudah dinilai' };

            function tampilkanCatatan(cs) {
                document.querySelectorAll('[data-catatan]').forEach(el => {
                    const t = (cs || {})[el.dataset.catatan];
                    el.hidden = !t; el.textContent = t || '';
                });
            }
            function sesuaikanTinggi() {
                document.querySelectorAll('textarea[data-q], textarea[data-idn]').forEach(t => {
                    t.style.height = 'auto';
                    t.style.height = (t.scrollHeight + 4) + 'px';
                });
            }

            window.addEventListener('message', e => {
                if (e.source !== window.parent || !e.data || typeof e.data !== 'object') return;
                const d = e.data;
                if (d.tipe === 'edukinetika-periksa-data') {
                    const rec = d.rec || {};
                    S.isian = rec.isian || {};
                    S.identitas = Object.assign({}, rec.identitas || {});
                    if (!S.identitas.nama && rec.nama) S.identitas.nama = rec.nama;
                    if (!S.identitas.kelas && rec.kelas) S.identitas.kelas = rec.kelas;
                    isiKeForm();
                    kunci();
                    const namaTampil = S.identitas.nama || d.nama || 'Siswa';
                    $('#namaBilah').textContent = `${namaTampil}${S.identitas.kelas ? ' · ' + S.identitas.kelas : ''}`;
                    $('#spandukStatus').innerHTML = `<div class="spanduk periksa">🔎 <div><strong>Mode periksa guru.</strong> Lembar ini sama persis dengan yang dikerjakan ${esc(namaTampil)}.<br>Status: ${esc(labelStatus[rec.status] || rec.status || '–')} · dikumpulkan ${esc(tglLengkap(rec.dikumpulkanPada))}${rec.nilai != null ? ` · nilai <strong>${esc(rec.nilai)}</strong>` : ''}</div></div>`;
                    tampilkanCatatan(d.catatanSoal || rec.catatanSoal);
                    requestAnimationFrame(sesuaikanTinggi);
                    setTimeout(sesuaikanTinggi, 400);
                } else if (d.tipe === 'edukinetika-periksa-catatan') {
                    tampilkanCatatan(d.catatanSoal);
                } else if (d.tipe === 'edukinetika-periksa-fokus') {
                    const el = document.querySelector(`[data-soal="${(window.CSS && CSS.escape) ? CSS.escape(d.qid) : d.qid}"]`);
                    if (!el) return;
                    if (el.hidden) el.hidden = false;
                    el.scrollIntoView({ behavior: 'smooth', block: 'center' });
                    el.classList.remove('sorot'); void el.offsetWidth; el.classList.add('sorot');
                }
            });
            window.addEventListener('resize', sesuaikanTinggi);
            if (window.parent !== window) window.parent.postMessage({ tipe: 'edukinetika-periksa-siap' }, asal);
        }

        /* =====================================================================
           MULAI
           ===================================================================== */
        const MODE_PERIKSA = new URLSearchParams(location.search).get('mode') === 'periksa';
        if (MODE_PERIKSA) {
            mulaiModePeriksa();
        } else {
            render();
            ikat();
            perbaruiTampilanTurunan();
            infoSimpan('proses', 'Menyambungkan…');
            await sambung();
            await muat();
        }
    </script>
</body>

</html>
