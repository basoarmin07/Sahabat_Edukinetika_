<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>LKPD 1: Teori Tumbukan dan Energi Aktivasi - EduKinetika</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --aksen: #2563eb;
            --aksen-muda: #dbeafe;
            --tinta: #0f172a;
            --teks: #334155;
            --redup: #64748b;
            --garis: #e2e8f0;
            --latar: #f4f7fa;
            --kartu: #ffffff;
        }

        * {
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
            -webkit-text-size-adjust: 100%;
        }

        body {
            margin: 0;
            font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
            color: var(--teks);
            background: var(--latar);
            background-image: radial-gradient(#e2e8f0 1px, transparent 1px);
            background-size: 28px 28px;
            line-height: 1.6;
        }

        a {
            color: var(--aksen);
        }

        .fase,
        #bagian-identitas,
        .soal {
            scroll-margin-top: 120px;
        }

        .wadah {
            max-width: 900px;
            margin: 0 auto;
            padding: 0 16px;
        }

        /* ---------- Bilah alat ---------- */
        .bilah {
            position: sticky;
            top: 0;
            z-index: 40;
            background: rgba(255, 255, 255, .92);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--garis);
        }

        .bilah-isi {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
            padding: 10px 16px;
            max-width: 900px;
            margin: 0 auto;
        }

        .bilah .judul-kecil {
            font-weight: 800;
            color: var(--tinta);
            font-size: .92rem;
            flex: 1 1 180px;
            min-width: 0;
        }

        .bilah .judul-kecil small {
            display: block;
            font-weight: 600;
            color: var(--redup);
            font-size: .72rem;
        }

        .simpan-info {
            font-size: .75rem;
            font-weight: 700;
            color: var(--redup);
            display: flex;
            align-items: center;
            gap: 6px;
            white-space: nowrap;
        }

        .simpan-info .titik {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #cbd5e1;
        }

        .simpan-info.ok .titik {
            background: #10b981;
        }

        .simpan-info.proses .titik {
            background: #f59e0b;
        }

        .simpan-info.lokal .titik {
            background: #3b82f6;
        }

        .simpan-info.galat .titik {
            background: #ef4444;
        }

        .tombol {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            border-radius: 12px;
            padding: 10px 14px;
            font: inherit;
            font-weight: 800;
            font-size: .85rem;
            border: 2px solid var(--garis);
            background: #fff;
            color: var(--tinta);
            cursor: pointer;
            text-decoration: none;
            transition: transform .1s, background .15s, border-color .15s;
        }

        .tombol:hover {
            border-color: var(--aksen);
        }

        .tombol:active {
            transform: scale(.98);
        }

        .tombol.utama {
            background: var(--aksen);
            border-color: var(--aksen);
            color: #fff;
        }

        .tombol.utama:hover {
            filter: brightness(1.07);
        }

        .tombol:disabled {
            opacity: .5;
            cursor: not-allowed;
        }

        .progres {
            height: 4px;
            background: #eef2f7;
        }

        .progres span {
            display: block;
            height: 100%;
            background: var(--aksen);
            width: 0;
            transition: width .4s;
        }

        /* ---------- Langkah fase ---------- */
        .langkah {
            display: flex;
            gap: 6px;
            overflow-x: auto;
            padding: 8px 16px 10px;
            max-width: 900px;
            margin: 0 auto;
            scrollbar-width: none;
        }

        .langkah::-webkit-scrollbar {
            display: none;
        }

        .langkah a {
            flex: 0 0 auto;
            text-decoration: none;
            font-size: .74rem;
            font-weight: 800;
            color: var(--redup);
            background: #fff;
            border: 1px solid var(--garis);
            border-radius: 999px;
            padding: 5px 11px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .langkah a .n {
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: #eef2f7;
            display: grid;
            place-items: center;
            font-size: .66rem;
        }

        .langkah a.aktif {
            background: var(--aksen);
            color: #fff;
            border-color: var(--aksen);
        }

        .langkah a.aktif .n {
            background: rgba(255, 255, 255, .25);
        }

        .langkah a.lengkap .n {
            background: #10b981;
            color: #fff;
        }

        /* ---------- Kartu umum ---------- */
        .kartu {
            background: var(--kartu);
            border: 1px solid #edf1f6;
            border-radius: 22px;
            box-shadow: 0 10px 30px -22px rgba(15, 23, 42, .45);
            padding: 20px;
            margin: 18px 0;
        }

        .sampul {
            position: relative;
            overflow: hidden;
            margin-top: 22px;
            background: linear-gradient(135deg, var(--aksen), var(--aksen-gelap, #1e3a8a));
            color: #fff;
            border: 0;
        }

        .sampul .label {
            display: inline-block;
            background: rgba(255, 255, 255, .18);
            border: 1px solid rgba(255, 255, 255, .3);
            border-radius: 999px;
            padding: 4px 12px;
            font-size: .75rem;
            font-weight: 800;
        }

        .sampul h1 {
            margin: 12px 0 6px;
            font-size: clamp(1.5rem, 4.2vw, 2.2rem);
            line-height: 1.15;
            letter-spacing: -.02em;
            color: #fff;
        }

        .sampul p {
            margin: 0;
            opacity: .92;
            max-width: 60ch;
        }

        .sampul .meta {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 16px;
        }

        .sampul .meta span {
            background: rgba(255, 255, 255, .15);
            border-radius: 10px;
            padding: 6px 10px;
            font-size: .78rem;
            font-weight: 700;
        }

        .sampul .hiasan {
            position: absolute;
            right: -30px;
            bottom: -40px;
            width: 220px;
            opacity: .16;
            pointer-events: none;
        }

        h2.judul-bagian {
            font-size: 1.25rem;
            margin: 0;
            color: var(--tinta);
            letter-spacing: -.01em;
        }

        h3 {
            color: var(--tinta);
        }

        .kepala-fase {
            display: flex;
            gap: 14px;
            align-items: flex-start;
        }

        .kepala-fase .no {
            width: 46px;
            height: 46px;
            flex: 0 0 46px;
            border-radius: 14px;
            background: var(--aksen-muda);
            color: var(--aksen);
            display: grid;
            place-items: center;
            font-weight: 800;
            font-size: 1.05rem;
        }

        .kepala-fase .sub {
            font-size: .75rem;
            font-weight: 800;
            color: var(--aksen);
        }

        .kepala-fase .ket {
            font-size: .85rem;
            color: var(--redup);
            margin-top: 2px;
        }

        .daftar {
            margin: 8px 0 0;
            padding-left: 20px;
        }

        .daftar li {
            margin: 4px 0;
        }

        .info {
            background: #f8fafc;
            border: 1px solid var(--garis);
            border-radius: 16px;
            padding: 14px 16px;
            margin: 14px 0;
        }

        .info.masalah {
            background: linear-gradient(180deg, #fff7ed, #fff);
            border-color: #fed7aa;
        }

        .info.masalah .tag {
            color: #c2410c;
        }

        .info .tag {
            font-size: .75rem;
            font-weight: 800;
            color: var(--aksen);
            display: flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 4px;
        }

        details.bantuan {
            border: 1px dashed #93c5fd;
            background: #eff6ff;
            border-radius: 14px;
            padding: 0 14px;
            margin: 12px 0;
        }

        details.bantuan summary {
            cursor: pointer;
            font-weight: 800;
            font-size: .85rem;
            color: #1d4ed8;
            padding: 10px 0;
            list-style: none;
        }

        details.bantuan summary::-webkit-details-marker {
            display: none;
        }

        details.bantuan summary::before {
            content: '💡 ';
        }

        details.bantuan[open] {
            padding-bottom: 12px;
        }

        details.bantuan .isi {
            font-size: .88rem;
        }

        .tautan-daftar {
            display: grid;
            gap: 8px;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            margin: 12px 0;
        }

        .tautan-daftar a {
            display: block;
            text-decoration: none;
            background: #fff;
            border: 2px solid var(--garis);
            border-radius: 14px;
            padding: 12px 14px;
            color: var(--tinta);
        }

        .tautan-daftar a:hover {
            border-color: var(--aksen);
        }

        .tautan-daftar a strong {
            display: block;
        }

        .tautan-daftar a span {
            font-size: .78rem;
            color: var(--redup);
        }

        /* ---------- Soal ---------- */
        .soal {
            margin: 18px 0 6px;
            padding-top: 16px;
            border-top: 1px solid #f1f5f9;
        }

        .soal:first-child {
            border-top: 0;
            padding-top: 0;
        }

        .soal .tanya {
            display: flex;
            gap: 10px;
            align-items: flex-start;
        }

        .soal .nomor {
            flex: 0 0 auto;
            min-width: 30px;
            height: 30px;
            padding: 0 6px;
            border-radius: 9px;
            background: var(--tinta);
            color: #fff;
            display: grid;
            place-items: center;
            font-weight: 800;
            font-size: .8rem;
        }

        .soal.terisi .nomor {
            background: #10b981;
        }

        .soal .teks-tanya {
            font-weight: 700;
            color: var(--tinta);
        }

        .chip {
            display: inline-block;
            font-size: .68rem;
            font-weight: 800;
            padding: 2px 8px;
            border-radius: 999px;
            margin-left: 4px;
            vertical-align: 2px;
        }

        .chip.tp {
            background: var(--aksen-muda);
            color: var(--aksen);
        }

        .chip.opsional {
            background: #fef3c7;
            color: #b45309;
        }

        .soal .jawab {
            margin: 10px 0 0 40px;
        }

        textarea,
        input[type=text],
        input[type=number],
        select {
            width: 100%;
            font: inherit;
            font-size: 16px;
            color: var(--tinta);
            border: 2px solid var(--garis);
            border-radius: 12px;
            padding: 10px 12px;
            background: #fff;
            transition: border-color .15s, box-shadow .15s;
        }

        textarea {
            resize: vertical;
            min-height: 88px;
            line-height: 1.55;
        }

        textarea:focus,
        input:focus,
        select:focus {
            outline: none;
            border-color: var(--aksen);
            box-shadow: 0 0 0 4px var(--aksen-muda);
        }

        textarea:disabled,
        input:disabled,
        select:disabled {
            background: #f8fafc;
            color: #475569;
        }

        .tabel-wadah {
            overflow-x: auto;
            border: 1px solid var(--garis);
            border-radius: 14px;
        }

        table.lkpd {
            border-collapse: collapse;
            width: 100%;
            min-width: 480px;
            font-size: .88rem;
        }

        table.lkpd th,
        table.lkpd td {
            border-bottom: 1px solid #eef2f7;
            padding: 8px;
            text-align: left;
            vertical-align: middle;
        }

        table.lkpd th {
            background: #f8fafc;
            font-size: .76rem;
            color: var(--redup);
            font-weight: 800;
        }

        table.lkpd td:first-child {
            font-weight: 700;
            color: var(--tinta);
            white-space: nowrap;
        }

        table.lkpd input,
        table.lkpd select {
            padding: 8px 10px;
            border-radius: 10px;
        }

        table.lkpd tr:last-child td {
            border-bottom: 0;
        }

        table.data {
            border-collapse: collapse;
            width: 100%;
            font-size: .9rem;
            margin: 10px 0;
        }

        table.data th,
        table.data td {
            border: 1px solid var(--garis);
            padding: 8px 10px;
            text-align: center;
        }

        table.data th {
            background: #f1f5f9;
            color: var(--tinta);
        }

        .pilihan-daftar {
            display: grid;
            gap: 8px;
        }

        .pilihan-daftar label {
            display: flex;
            gap: 10px;
            align-items: flex-start;
            border: 2px solid var(--garis);
            border-radius: 12px;
            padding: 10px 12px;
            cursor: pointer;
            background: #fff;
        }

        .pilihan-daftar label:has(input:checked) {
            border-color: var(--aksen);
            background: var(--aksen-muda);
        }

        .pilihan-daftar input {
            margin-top: 5px;
            accent-color: var(--aksen);
        }

        .diagram {
            background: #fff;
            border: 1px solid var(--garis);
            border-radius: 14px;
            padding: 10px;
        }

        .diagram svg {
            width: 100%;
            height: auto;
            display: block;
        }

        .penanda-daftar {
            display: grid;
            gap: 8px;
            grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
            margin-top: 10px;
        }

        .penanda-daftar label {
            display: flex;
            gap: 8px;
            align-items: center;
            font-weight: 800;
            color: var(--tinta);
        }

        .penanda-daftar .bulat {
            width: 26px;
            height: 26px;
            flex: 0 0 26px;
            border-radius: 50%;
            background: var(--aksen);
            color: #fff;
            display: grid;
            place-items: center;
            font-size: .8rem;
        }

        .grafik {
            margin-top: 10px;
            background: #fff;
            border: 1px solid var(--garis);
            border-radius: 14px;
            padding: 10px 12px;
        }

        .grafik .jdl {
            font-size: .76rem;
            font-weight: 800;
            color: var(--redup);
            margin-bottom: 4px;
        }

        .grafik svg {
            width: 100%;
            max-width: 560px;
            height: auto;
            display: block;
        }

        .data-lab {
            margin-top: 10px;
            font-size: .82rem;
            background: #f0fdf4;
            border: 1px solid #bbf7d0;
            border-radius: 12px;
            padding: 10px 12px;
        }

        .data-lab strong {
            color: #166534;
        }

        .data-lab ul {
            margin: 6px 0 0;
            padding-left: 18px;
        }

        .catatan-guru {
            margin: 10px 0 0 40px;
            background: #fff7ed;
            border: 1px solid #fdba74;
            border-radius: 12px;
            padding: 8px 12px;
            font-size: .85rem;
            color: #9a3412;
        }

        .catatan-guru::before {
            content: '✏️ Catatan guru: ';
            font-weight: 800;
        }

        .spanduk {
            border-radius: 16px;
            padding: 14px 16px;
            margin: 16px 0 0;
            font-size: .9rem;
            display: flex;
            gap: 10px;
            align-items: flex-start;
        }

        .spanduk.biru {
            background: #eff6ff;
            border: 1px solid #bfdbfe;
            color: #1e3a8a;
        }

        .spanduk.kuning {
            background: #fffbeb;
            border: 1px solid #fde68a;
            color: #92400e;
        }

        .spanduk.hijau {
            background: #ecfdf5;
            border: 1px solid #a7f3d0;
            color: #065f46;
        }

        .spanduk.merah {
            background: #fef2f2;
            border: 1px solid #fecaca;
            color: #991b1b;
        }

        .spanduk .nilai-besar {
            font-size: 2rem;
            font-weight: 800;
            line-height: 1;
        }

        .identitas {
            display: grid;
            gap: 12px;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
        }

        .identitas label {
            font-size: .78rem;
            font-weight: 800;
            color: var(--redup);
            display: grid;
            gap: 4px;
        }

        .kirim {
            text-align: center;
        }

        .kirim p {
            color: var(--redup);
            font-size: .88rem;
        }

        .toast {
            position: fixed;
            left: 50%;
            bottom: calc(16px + env(safe-area-inset-bottom, 0px));
            transform: translate(-50%, 20px);
            background: var(--tinta);
            color: #fff;
            padding: 10px 16px;
            border-radius: 12px;
            font-weight: 700;
            font-size: .88rem;
            opacity: 0;
            pointer-events: none;
            transition: .25s;
            z-index: 90;
            max-width: calc(100vw - 32px);
            text-align: center;
        }

        .toast.tampil {
            opacity: 1;
            transform: translate(-50%, 0);
        }

        .modal-latar {
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, .55);
            z-index: 80;
            display: grid;
            place-items: center;
            padding: 16px;
        }

        .modal-latar[hidden] {
            display: none;
        }

        .modal {
            background: #fff;
            border-radius: 20px;
            max-width: 440px;
            width: 100%;
            padding: 22px;
            box-shadow: 0 30px 60px rgba(0, 0, 0, .3);
        }

        .modal h3 {
            margin: 0 0 6px;
        }

        .modal .aksi {
            display: flex;
            gap: 8px;
            justify-content: flex-end;
            margin-top: 16px;
            flex-wrap: wrap;
        }

        .modal ul {
            font-size: .86rem;
            max-height: 180px;
            overflow: auto;
            padding-left: 18px;
        }

        .salah-isi {
            border-color: #f87171 !important;
        }

        .cetak-saja,
        .nilai-cetak {
            display: none;
        }

        button:focus-visible,
        a:focus-visible,
        summary:focus-visible {
            outline: 3px solid var(--aksen-muda);
            outline-offset: 2px;
        }

        @media (max-width: 560px) {
            .kartu {
                padding: 16px;
                border-radius: 18px;
            }

            .soal .jawab,
            .catatan-guru {
                margin-left: 0;
            }

            .bilah-isi {
                gap: 8px;
                padding: 8px 12px;
            }

            .bilah .judul-kecil {
                flex: 1 1 0;
                font-size: .8rem;
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis;
            }

            .bilah .judul-kecil small {
                overflow: hidden;
                text-overflow: ellipsis;
            }

            .bilah-isi .tombol {
                padding: 8px 10px;
            }

            #tombolCetak .teks-tombol {
                display: none;
            }

            .simpan-info {
                order: 5;
                flex-basis: 100%;
                font-size: .7rem;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            html {
                scroll-behavior: auto;
            }

            * {
                transition: none !important;
            }
        }

        /* ---------- CETAK / PDF ---------- */
        @page {
            size: A4;
            margin: 16mm 14mm;
        }

        @media print {
            body {
                background: #fff;
                font-size: 11pt;
                color: #000;
            }

            .bilah,
            .langkah,
            .tautan-daftar,
            details.bantuan,
            .kirim,
            .toast,
            .modal-latar,
            .layar-saja,
            .data-lab {
                display: none !important;
            }

            .wadah {
                max-width: none;
                padding: 0;
            }

            .kartu {
                box-shadow: none;
                border: 1px solid #cbd5e1;
                border-radius: 8px;
                padding: 12px 14px;
                margin: 10px 0;
                break-inside: auto;
            }

            .sampul {
                background: #fff !important;
                color: #000;
                border: 2px solid #000;
            }

            .sampul h1,
            .sampul p,
            .sampul .label,
            .sampul .meta span {
                color: #000 !important;
                background: none !important;
                border-color: #000 !important;
            }

            .sampul .hiasan {
                display: none;
            }

            .soal {
                break-inside: avoid;
            }

            .kepala-fase {
                break-after: avoid;
                page-break-after: avoid;
            }

            .info,
            .tabel-wadah,
            .diagram,
            .grafik,
            .pilihan-daftar {
                break-inside: avoid;
            }

            .cetak-saja {
                display: block;
            }

            textarea {
                display: none !important;
            }

            .nilai-cetak {
                display: block;
                white-space: pre-wrap;
                border: 1px solid #94a3b8;
                border-radius: 6px;
                padding: 6px 8px;
                min-height: 42px;
                font-size: 10.5pt;
            }

            input,
            select {
                border: 1px solid #94a3b8 !important;
                border-radius: 6px !important;
                box-shadow: none !important;
                background: #fff !important;
                color: #000 !important;
            }

            table.lkpd {
                min-width: 0;
            }

            .tabel-wadah {
                overflow: visible;
                border-color: #94a3b8;
            }

            .kepala-fase .no {
                border: 1px solid #000;
                background: #fff;

            height: 100%;

            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);

            align-items: center;
            gap: 10px;
            border: 0;
            border-radius: 999px;
            padding: 12px 20px 12px 14px;

            content: '';

            top: 8px;

            border: 0;
            background: none;
            cursor: pointer;
            position: relative;

        .anim-titik button::before {
            content: '';
            position: absolute;
            left: 0;
            right: 0;
            top: 10px;
            height: 5px;
            border-radius: 99px;
            background: rgba(255, 255, 255, .2);
        }

            top: 10px;
            height: 5px;
            width: 0;
            border-radius: 99px;

    <script>
        /* =====================================================================
           ANIMASI ORIENTASI MASALAH (Fase 1 PBL)
           Mesin animasi kanvas kecil: adegan bertahap + teks penjelas,
           tombol putar/jeda, ulangi, dan lompat ke adegan tertentu.
           ===================================================================== */
        (function () {
            'use strict';
            const W = 480, H = 300;
            const ADEGAN = {};
            const kurangiGerak = !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);

            // Bilangan acak berbenih agar animasi selalu sama ketika diulang
            function acak(benih) {
                let s = (benih >>> 0) || 1;
                return () => { s ^= s << 13; s >>>= 0; s ^= s >>> 17; s ^= s << 5; s >>>= 0; return s / 4294967296; };
            }

            /* ---------- Alat gambar ---------- */
            const ATOM = {
                C: ['#4b5563', 5], O: ['#ef4444', 4.8], H: ['#f8fafc', 2.8], N: ['#3b82f6', 5.2]
            };
            const BENTUK = {
                C3H8: [['H', -14, -1], ['H', -10, 8], ['H', 0, -10], ['H', 10, 8], ['H', 14, -1], ['C', -9, 2], ['C', 0, -3], ['C', 9, 2]],
                O2: [['O', -4.2, 0], ['O', 4.2, 0]],
                CO2: [['O', -8, 0], ['O', 8, 0], ['C', 0, 0]],
                H2O: [['O', 0, 0], ['H', -5.5, 4], ['H', 5.5, 4]],
                NO: [['N', -4.3, 0], ['O', 4.3, 0]],
                NO2: [['O', -7, 4], ['O', 7, 4], ['N', 0, -1]]
            };
            const U = {
                W, H, ts: 1,
                uk(n) { return n * U.ts; },
                kotak(ctx, x, y, w, h, r) {
                    r = Math.min(r, w / 2, h / 2);
                    ctx.beginPath(); ctx.moveTo(x + r, y);
                    ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
                    ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
                },
                huruf(ukuran, tebal) { return `${tebal || 700} ${ukuran || 12}px "Plus Jakarta Sans", system-ui, sans-serif`; },
                teks(ctx, s, x, y, o) {
                    o = o || {};
                    ctx.font = U.huruf(o.ukuran, o.tebal); ctx.fillStyle = o.warna || '#0f172a';
                    ctx.textAlign = o.rata || 'left'; ctx.textBaseline = o.dasar || 'alphabetic';
                    ctx.fillText(s, x, y);
                },
                label(ctx, s, x, y, o) {
                    o = o || {};
                    const uk = o.ukuran || 11;
                    ctx.font = U.huruf(uk, o.tebal || 800);
                    const w = ctx.measureText(s).width + 14, h = uk + 9;
                    const x0 = o.rata === 'center' ? x - w / 2 : o.rata === 'right' ? x - w : x;
                    U.kotak(ctx, x0, y - h / 2, w, h, h / 2);
                    ctx.fillStyle = o.latar || 'rgba(255,255,255,.94)'; ctx.fill();
                    if (o.garis) { ctx.lineWidth = 1.2; ctx.strokeStyle = o.garis; ctx.stroke(); }
                    ctx.fillStyle = o.warna || '#0f172a'; ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
                    ctx.fillText(s, x0 + 7, y + .5);
                    return w;
                },
                atom(ctx, jenis, x, y) {
                    const [warna, r] = ATOM[jenis];
                    ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fillStyle = warna; ctx.fill();
                    ctx.lineWidth = 1; ctx.strokeStyle = 'rgba(15,23,42,.55)'; ctx.stroke();
                    ctx.beginPath(); ctx.arc(x - r * .35, y - r * .38, r * .34, 0, Math.PI * 2);
                    ctx.fillStyle = 'rgba(255,255,255,.6)'; ctx.fill();
                },
                molekul(ctx, jenis, x, y, sudut, skala, alpha) {
                    ctx.save(); ctx.translate(x, y); ctx.rotate(sudut || 0);
                    if (skala && skala !== 1) ctx.scale(skala, skala);
                    ctx.globalAlpha = alpha == null ? 1 : alpha;
                    if (jenis === 'NO2') { ctx.beginPath(); ctx.arc(0, 1, 13, 0, Math.PI * 2); ctx.fillStyle = 'rgba(180,83,9,.28)'; ctx.fill(); }
                    BENTUK[jenis].forEach(([a, dx, dy]) => U.atom(ctx, a, dx, dy));
                    ctx.restore();
                },
                // Panel gelap berisi baris teks; tiap baris = [[teks, warna], ...]
                panel(ctx, baris, x, y, ekstra) {
                    const uk = U.uk(11.5), tinggiBaris = uk + 6;
                    ctx.font = U.huruf(uk, 800);
                    const lebar = Math.max(...baris.map(b => b.reduce((s, [t]) => s + ctx.measureText(t).width, 0)));
                    const w = lebar + 20, h = baris.length * tinggiBaris + 12 + (ekstra || 0);
                    U.kotak(ctx, x, y, w, h, 10); ctx.fillStyle = 'rgba(15,23,42,.86)'; ctx.fill();
                    ctx.textBaseline = 'middle'; ctx.textAlign = 'left';
                    baris.forEach((b, i) => {
                        let cx = x + 10; const cy = y + 6 + tinggiBaris * i + tinggiBaris / 2;
                        b.forEach(([t, warna]) => { ctx.fillStyle = warna || '#fff'; ctx.fillText(t, cx, cy); cx += ctx.measureText(t).width; });
                    });
                    return { x, y, w, h, bawah: y + baris.length * tinggiBaris + 6 };
                },
                // Keterangan simbol di bagian bawah adegan; item = [jenis, label panjang, label pendek]
                legenda(ctx, item, y) {
                    const uk = U.uk(11), sk = Math.min(1.25, .9 * U.ts);
                    U.kotak(ctx, 8, y - 17, W - 16, 34, 12);
                    ctx.fillStyle = 'rgba(255,255,255,.93)'; ctx.fill();
                    ctx.font = U.huruf(uk, 700);
                    const ikon = 34 * sk, jarak = 18;
                    let pakai = 1, lebar = item.map(it => ikon + ctx.measureText(it[1]).width);
                    let total = lebar.reduce((a, b) => a + b, 0) + jarak * (item.length - 1);
                    if (total > W - 36) {
                        pakai = 2; lebar = item.map(it => ikon + ctx.measureText(it[2] || it[1]).width);
                        total = lebar.reduce((a, b) => a + b, 0) + jarak * (item.length - 1);
                    }
                    const sisa = Math.max(0, (W - 36 - total) / (item.length + 1));
                    let x = 18 + sisa;
                    item.forEach((it, i) => {
                        U.molekul(ctx, it[0], x + ikon / 2 - 4, y, 0, sk);
                        U.teks(ctx, it[pakai] || it[1], x + ikon, y + uk * .36, { ukuran: uk, tebal: 700, warna: '#334155' });
                        x += lebar[i] + jarak + sisa;
                    });
                }
            };

            /* ---------- Markup ---------- */
            function html(it) {
                const a = ADEGAN[it.adegan];
                if (!a) return '';
                const titik = a.langkah.map((l, i) =>
                    `<button type="button" data-i="${i}" aria-label="Adegan ${i + 1}: ${l.pendek || ''}"><i></i></button>`).join('');
                return `<figure class="anim-orientasi layar-saja" data-adegan="${it.adegan}">
                    <div class="anim-kepala"><span class="anim-tag">🎬 ${a.judul}</span><span class="anim-hitung">Adegan 1/${a.langkah.length}</span></div>
                    <div class="anim-layar">
                        <canvas role="img" aria-label="${a.alt}"></canvas>
                        <button type="button" class="anim-mulai"><span class="segitiga" aria-hidden="true"></span>Putar animasi</button>
                    </div>
                    <figcaption class="anim-bawah">
                        <p class="anim-teks" aria-live="polite">${a.langkah[0].teks}</p>
                        <div class="anim-kendali">
                            <div class="anim-titik" role="group" aria-label="Pilih adegan">${titik}</div>
                            <button type="button" class="anim-tombol" data-aksi="putar" aria-label="Putar animasi"><span class="ikn" aria-hidden="true">▶</span><span class="tks">Putar</span></button>
                            <button type="button" class="anim-tombol" data-aksi="ulang" aria-label="Ulangi animasi"><span class="ikn" aria-hidden="true">↺</span><span class="tks">Ulangi</span></button>
                        </div>
                    </figcaption>
                </figure>`;
            }

            /* ---------- Pemutar ---------- */
            function pasang(el) {
                if (el.dataset.terpasang) return;
                const a = ADEGAN[el.dataset.adegan];
                if (!a) return;
                el.dataset.terpasang = '1';
                const cv = el.querySelector('canvas'), ctx = cv.getContext('2d');
                const teksEl = el.querySelector('.anim-teks'), hitungEl = el.querySelector('.anim-hitung');
                const titikEl = Array.from(el.querySelectorAll('.anim-titik button'));
                const tPutar = el.querySelector('[data-aksi="putar"]'), tUlang = el.querySelector('[data-aksi="ulang"]');
                const tMulai = el.querySelector('.anim-mulai');

                const awal = []; let total = 0;
                a.langkah.forEach(l => { awal.push(total); total += l.durasi; });
                let st = null, t = 0, main = false, terlihat = false, pernahMain = false, idx = -1, sebelum = 0, skala = 1, ts = 1;
                const info = { t: 0, langkah: 0, lokal: 0, p: 0, selesai: false };

                function hitungInfo() {
                    let i = 0;
                    for (let k = 0; k < awal.length; k++) if (t >= awal[k]) i = k;
                    info.t = t; info.langkah = i; info.lokal = t - awal[i];
                    info.p = Math.min(1, info.lokal / a.langkah[i].durasi);
                    info.selesai = t >= total;
                }
                function reset() { st = a.buat(acak(a.benih || 7)); t = 0; hitungInfo(); }
                function maju(dt) { t += dt; hitungInfo(); a.perbarui(st, dt, info); }
                function gambar() {
                    if (!st || !cv.width) return;
                    ctx.setTransform(skala, 0, 0, skala, 0, 0);
                    ctx.clearRect(0, 0, W, H);
                    U.ts = ts;
                    a.gambar(ctx, st, info, U);
                }
                function segarkanUI() {
                    if (info.langkah !== idx) {
                        idx = info.langkah;
                        teksEl.innerHTML = a.langkah[idx].teks;
                        hitungEl.textContent = `Adegan ${idx + 1}/${a.langkah.length}`;
                        titikEl.forEach((b, i) => {
                            b.classList.toggle('aktif', i === idx);
                            b.classList.toggle('lewat', i < idx);
                            if (i === idx) b.setAttribute('aria-current', 'step'); else b.removeAttribute('aria-current');
                        });
                    }
                    const b = titikEl[idx];
                    if (b) b.firstElementChild.style.width = (info.p * 100).toFixed(1) + '%';
                    el.classList.toggle('tamat', info.selesai);
                }
                function lompat(target) {
                    reset();
                    while (t < target) maju(1 / 30);
                    segarkanUI(); gambar();
                }
                function aturMain(v) {
                    main = v;
                    tPutar.querySelector('.ikn').textContent = v ? '❚❚' : '▶';
                    tPutar.querySelector('.tks').textContent = v ? 'Jeda' : 'Putar';
                    tPutar.setAttribute('aria-label', v ? 'Jeda animasi' : 'Putar animasi');
                    el.classList.toggle('berjalan', v);
                    if (v) { pernahMain = true; tMulai.hidden = true; }
                }
                function ukur() {
                    const w = cv.clientWidth;
                    if (!w) return;
                    const dpr = Math.min(2, window.devicePixelRatio || 1);
                    cv.width = Math.round(w * dpr);
                    cv.height = Math.round(w * H / W * dpr);
                    skala = cv.width / W;
                    ts = Math.max(1, Math.min(1.5, 470 / w));
                    gambar();
                }
                function putaran(now) {
                    const dt = sebelum ? Math.min(0.05, (now - sebelum) / 1000) : 0;
                    sebelum = now;
                    if (main && terlihat && dt > 0) { maju(dt); gambar(); segarkanUI(); }
                    requestAnimationFrame(putaran);
                }

                tMulai.addEventListener('click', () => { if (info.selesai) lompat(0); aturMain(true); });
                tPutar.addEventListener('click', () => { if (!main && info.selesai) lompat(0); aturMain(!main); });
                tUlang.addEventListener('click', () => { lompat(0); aturMain(true); });
                titikEl.forEach((b, i) => b.addEventListener('click', () => {
                    lompat(awal[i] + 0.001);
                    aturMain(!kurangiGerak);
                    if (kurangiGerak) tMulai.hidden = true;
                }));

                reset(); segarkanUI();
                if ('ResizeObserver' in window) new ResizeObserver(ukur).observe(cv); else window.addEventListener('resize', ukur);
                ukur();
                if (document.fonts && document.fonts.ready) document.fonts.ready.then(gambar);

                if ('IntersectionObserver' in window) {
                    new IntersectionObserver(ent => ent.forEach(e => {
                        terlihat = e.isIntersecting;
                        if (terlihat && !pernahMain && !kurangiGerak) aturMain(true);
                    }), { threshold: 0.35 }).observe(el);
                } else { terlihat = true; if (!kurangiGerak) aturMain(true); }
                requestAnimationFrame(putaran);
            }

            function pasangSemua() { document.querySelectorAll('.anim-orientasi').forEach(pasang); }
            document.addEventListener('DOMContentLoaded', () => {
                pasangSemua();
                const isi = document.getElementById('isiLkpd');
                if (isi && 'MutationObserver' in window) new MutationObserver(pasangSemua).observe(isi, { childList: true, subtree: true });
            });

            window.AnimasiOrientasi = { html, U, daftar: (nama, def) => { ADEGAN[nama] = def; } };
        })();
    </script>
    <script>
        /* Adegan: kebocoran gas LPG di dapur tertutup (LKPD Teori Tumbukan) */
        (function () {
            const AO = window.AnimasiOrientasi;
            const X0 = 14, X1 = 466, Y0 = 20, Y1 = 232;
            const BOCOR = { x: 90, y: 164 }, SAKLAR = { x: 436, y: 132 };

            function baru(r, jenis, x, y, kec) {
                const a = r() * Math.PI * 2, v = (kec || 36) * (0.75 + r() * 0.5);
                return { jenis, x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, rot: r() * 6.28, vr: (r() - .5) * 2.4, jeda: 0, panas: 0 };
            }

            AO.daftar('lpg', {
                judul: 'Animasi permasalahan: kebocoran gas LPG',
                alt: 'Animasi dapur tertutup. Gas LPG bocor dan bercampur dengan oksigen tanpa bereaksi selama berjam-jam, lalu percikan api dari saklar lampu memicu ledakan.',
                benih: 11,
                langkah: [
                    { durasi: 6, pendek: 'gas bocor', teks: 'Selang regulator bocor. Gas LPG (propana, C₃H₈) keluar dan bercampur dengan oksigen (O₂) di dalam dapur yang tertutup.' },
                    { durasi: 6.5, pendek: 'berjam-jam', teks: 'Berjam-jam berlalu. Partikel gas terus bergerak dan saling bertumbukan, tetapi <strong>tidak ada reaksi yang terjadi</strong>.' },
                    { durasi: 3.5, pendek: 'saklar', teks: 'Seseorang menekan saklar lampu. Di dalam saklar muncul <strong>percikan api kecil</strong>.' },
                    { durasi: 5, pendek: 'ledakan', teks: 'Dalam sekejap reaksi menjalar ke seluruh ruangan: <strong>ledakan!</strong> Propana dan oksigen berubah menjadi CO₂ dan H₂O.' },
                    { durasi: 6, pendek: 'pertanyaan', teks: '<strong>Mengapa campuran gas tidak bereaksi sejak awal? Apa peran percikan api?</strong> Tuliskan temuan dan dugaanmu pada soal di bawah.' }
                ],

                buat(r) {
                    const st = { r, mol: [], efek: [], percik: [], tumbukan: 0, reaksi: 0, jam: 0, saklar: 0, gel: -1, kilat: 0, guncang: 0, emisi: 0, waktu: 0 };
                    for (let i = 0; i < 16; i++) st.mol.push(baru(r, 'O2', X0 + 20 + r() * (X1 - X0 - 40), Y0 + 20 + r() * (Y1 - Y0 - 60)));
                    return st;
                },

                perbarui(st, dt, info) {
                    const r = st.r, L = info.langkah;
                    st.waktu += dt;
                    st.jam = L === 0 ? info.p : L === 1 ? 1 + info.p * 3 : 4;

                    // Gas keluar dari kebocoran
                    if (L <= 1) {
                        st.emisi += dt;
                        const propana = st.mol.filter(m => m.jenis === 'C3H8').length;
                        if (st.emisi > (L === 0 ? 0.55 : 1.2) && propana < 12) {
                            st.emisi = 0;
                            const m = baru(r, 'C3H8', BOCOR.x, BOCOR.y - 4, 34);
                            m.vy = -Math.abs(m.vy) - 10; m.vx = Math.abs(m.vx) * .6 + 8;
                            st.mol.push(m);
                            st.efek.push({ jenis: 'desis', x: BOCOR.x, y: BOCOR.y, t: 0 });
                        }
                    }

                    // Saklar dan percikan
                    if (L === 2 && info.lokal > 1) st.saklar = 1;
                    if (L >= 3) st.saklar = 1;
                    if (L === 2 && info.lokal > 1 && info.lokal < 2.8 && r() < 0.6) {
                        for (let i = 0; i < 3; i++) st.percik.push({ x: SAKLAR.x - 6, y: SAKLAR.y, vx: -20 - r() * 90, vy: (r() - .6) * 110, t: 0 });
                    }

                    // Gelombang ledakan
                    if (L >= 3) {
                        if (st.gel < 0) { st.gel = 0; st.kilat = 1; st.guncang = 1; st.bara = 1; }
                        st.gel += 320 * dt;
                        st.mol.forEach(m => {
                            if (m.jenis !== 'C3H8') return;
                            if (Math.hypot(m.x - SAKLAR.x, m.y - SAKLAR.y) > st.gel) return;
                            m.jenis = 'CO2'; m.panas = 1; st.reaksi++;
                            const v = 110; const a = r() * 6.28; m.vx = Math.cos(a) * v; m.vy = Math.sin(a) * v;
                            // Satu O₂ terdekat ikut bereaksi menjadi H₂O
                            let dekat = null, jd = 1e9;
                            st.mol.forEach(o => { if (o.jenis === 'O2') { const d = Math.hypot(o.x - m.x, o.y - m.y); if (d < jd) { jd = d; dekat = o; } } });
                            if (dekat) { dekat.jenis = 'H2O'; dekat.panas = 1; }
                            const h = baru(r, 'H2O', m.x + 8, m.y + 6, 110); h.panas = 1; st.mol.push(h);
                            st.efek.push({ jenis: 'nyala', x: m.x, y: m.y, t: 0 });
                        });
                    }
                    st.kilat = Math.max(0, st.kilat - dt * 1.3);
                    st.guncang = Math.max(0, st.guncang - dt * 1.6);
                    st.bara = Math.max(0, (st.bara || 0) - dt * .12);

                    // Gerak molekul
                    st.mol.forEach(m => {
                        if (m.panas > 0) {
                            m.panas = Math.max(0, m.panas - dt * .25);
                            const v = Math.hypot(m.vx, m.vy), target = 45 + 70 * m.panas;
                            if (v > 0) { m.vx *= target / v; m.vy *= target / v; }
                        }
                        m.x += m.vx * dt; m.y += m.vy * dt; m.rot += m.vr * dt; m.jeda -= dt;
                        if (m.x < X0 + 10) { m.x = X0 + 10; m.vx = Math.abs(m.vx); }
                        if (m.x > X1 - 10) { m.x = X1 - 10; m.vx = -Math.abs(m.vx); }
                        if (m.y < Y0 + 10) { m.y = Y0 + 10; m.vy = Math.abs(m.vy); }
                        if (m.y > Y1 - 10) { m.y = Y1 - 10; m.vy = -Math.abs(m.vy); }
                    });

                    // Tumbukan antarpartikel (lenting)
                    const n = st.mol.length;
                    for (let i = 0; i < n; i++) for (let j = i + 1; j < n; j++) {
                        const a = st.mol[i], b = st.mol[j];
                        const dx = b.x - a.x, dy = b.y - a.y, d = Math.hypot(dx, dy);
                        if (d > 0 && d < 17) {
                            const nx = dx / d, ny = dy / d, geser = (17 - d) / 2;
                            a.x -= nx * geser; a.y -= ny * geser; b.x += nx * geser; b.y += ny * geser;
                            const va = a.vx * nx + a.vy * ny, vb = b.vx * nx + b.vy * ny;
                            if (va - vb > 0) {
                                a.vx += (vb - va) * nx; a.vy += (vb - va) * ny;
                                b.vx += (va - vb) * nx; b.vy += (va - vb) * ny;
                                if (a.jeda <= 0 && b.jeda <= 0 && L <= 2) {
                                    st.tumbukan++;
                                    st.efek.push({ jenis: 'tuk', x: a.x + dx / 2, y: a.y + dy / 2, t: 0 });
                                    a.jeda = b.jeda = .3;
                                }
                            }
                        }
                    }

                    st.efek.forEach(e => e.t += dt);
                    st.efek = st.efek.filter(e => e.t < .5);
                    st.percik.forEach(p => { p.t += dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 260 * dt; });
                    st.percik = st.percik.filter(p => p.t < .45);
                },

                gambar(ctx, st, info, U) {
                    const W = U.W, H = U.H, L = info.langkah;
                    ctx.save();
                    if (st.guncang > 0) ctx.translate(Math.sin(st.waktu * 70) * 4 * st.guncang, Math.cos(st.waktu * 55) * 3 * st.guncang);

                    // Dinding dan ubin
                    const gd = ctx.createLinearGradient(0, 0, 0, 236);
                    gd.addColorStop(0, '#e6eef8'); gd.addColorStop(1, '#f5f8fc');
                    ctx.fillStyle = gd; ctx.fillRect(-10, -10, W + 20, 248);
                    ctx.strokeStyle = 'rgba(148,163,184,.28)'; ctx.lineWidth = 1;
                    for (let x = 96; x <= 236; x += 20) { ctx.beginPath(); ctx.moveTo(x, 140); ctx.lineTo(x, 196); ctx.stroke(); }
                    for (let y = 140; y <= 196; y += 14) { ctx.beginPath(); ctx.moveTo(96, y); ctx.lineTo(236, y); ctx.stroke(); }

                    // Jendela tertutup
                    U.kotak(ctx, 290, 52, 96, 72, 6); ctx.fillStyle = '#bfdbfe'; ctx.fill();
                    ctx.lineWidth = 4; ctx.strokeStyle = '#94a3b8'; ctx.stroke();
                    ctx.beginPath(); ctx.moveTo(338, 52); ctx.lineTo(338, 124); ctx.moveTo(290, 88); ctx.lineTo(386, 88); ctx.lineWidth = 3; ctx.stroke();

                    // Lampu gantung (mati)
                    ctx.strokeStyle = '#64748b'; ctx.lineWidth = 1.5;
                    ctx.beginPath(); ctx.moveTo(230, 0); ctx.lineTo(230, 22); ctx.stroke();
                    ctx.beginPath(); ctx.moveTo(214, 36); ctx.lineTo(246, 36); ctx.lineTo(238, 22); ctx.lineTo(222, 22); ctx.closePath();
                    ctx.fillStyle = '#475569'; ctx.fill();
                    ctx.beginPath(); ctx.arc(230, 39, 5, 0, Math.PI); ctx.fillStyle = '#e2e8f0'; ctx.fill();

                    // Lantai
                    ctx.fillStyle = '#cdb994'; ctx.fillRect(-10, 236, W + 20, 80);
                    ctx.fillStyle = 'rgba(0,0,0,.08)'; ctx.fillRect(-10, 236, W + 20, 3);

                    // Meja dapur + kompor
                    ctx.fillStyle = '#94a3b8'; ctx.fillRect(100, 198, 132, 38);
                    ctx.fillStyle = '#64748b'; ctx.fillRect(100, 198, 132, 5);
                    ctx.fillStyle = '#1f2937'; U.kotak(ctx, 116, 186, 100, 13, 3); ctx.fill();
                    ctx.fillStyle = '#374151'; ctx.fillRect(134, 182, 20, 4); ctx.fillRect(178, 182, 20, 4);
                    ctx.fillStyle = '#e5e7eb'; ctx.beginPath(); ctx.arc(126, 193, 2.5, 0, 6.3); ctx.arc(206, 193, 2.5, 0, 6.3); ctx.fill();

                    // Tabung LPG 3 kg (hijau)
                    ctx.fillStyle = '#16a34a'; U.kotak(ctx, 34, 170, 42, 64, 16); ctx.fill();
                    ctx.fillStyle = 'rgba(255,255,255,.25)'; U.kotak(ctx, 40, 176, 8, 50, 4); ctx.fill();
                    ctx.fillStyle = '#15803d'; ctx.fillRect(34, 226, 42, 8);
                    ctx.fillStyle = '#9ca3af'; ctx.fillRect(49, 160, 12, 11);
                    ctx.fillStyle = '#6b7280'; U.kotak(ctx, 45, 154, 20, 8, 3); ctx.fill();
                    U.teks(ctx, 'LPG', 55, 206, { ukuran: 10, tebal: 800, warna: '#fff', rata: 'center' });

                    // Selang ke kompor, dengan titik bocor
                    ctx.strokeStyle = '#1f2937'; ctx.lineWidth = 4; ctx.lineCap = 'round';
                    ctx.beginPath(); ctx.moveTo(63, 158); ctx.bezierCurveTo(88, 150, 96, 176, 118, 192); ctx.stroke();
                    if (L <= 1) {
                        ctx.strokeStyle = 'rgba(100,116,139,.8)'; ctx.lineWidth = 1.4;
                        for (let i = 0; i < 3; i++) {
                            const f = (st.waktu * 1.6 + i / 3) % 1;
                            ctx.globalAlpha = 1 - f;
                            ctx.beginPath(); ctx.arc(BOCOR.x + 2, BOCOR.y - 2, 5 + f * 12, -2.2, -0.6); ctx.stroke();
                        }
                        ctx.globalAlpha = 1;
                    }

                    // Saklar lampu
                    ctx.fillStyle = '#fff'; U.kotak(ctx, SAKLAR.x - 11, SAKLAR.y - 17, 22, 34, 4); ctx.fill();
                    ctx.strokeStyle = '#94a3b8'; ctx.lineWidth = 1.5; ctx.stroke();
                    ctx.fillStyle = '#334155'; U.kotak(ctx, SAKLAR.x - 4, st.saklar ? SAKLAR.y - 1 : SAKLAR.y - 11, 8, 12, 2); ctx.fill();
                    if (L === 2 && !st.saklar) {
                        const d = Math.sin(st.waktu * 8) * 3;
                        U.label(ctx, 'klik!', SAKLAR.x - 16 + d, SAKLAR.y - 32, { rata: 'right', ukuran: U.uk(11), latar: '#fef3c7', warna: '#92400e' });
                    }

                    // Efek tumbukan tidak efektif
                    st.efek.forEach(e => {
                        const f = e.t / .5;
                        if (e.jenis === 'tuk') {
                            ctx.strokeStyle = `rgba(71,85,105,${.55 * (1 - f)})`; ctx.lineWidth = 1.5;
                            ctx.beginPath(); ctx.arc(e.x, e.y, 5 + f * 11, 0, 6.3); ctx.stroke();
                        } else if (e.jenis === 'nyala') {
                            ctx.fillStyle = `rgba(251,146,60,${.7 * (1 - f)})`;
                            ctx.beginPath(); ctx.arc(e.x, e.y, 8 + f * 20, 0, 6.3); ctx.fill();
                        }
                    });

                    // Molekul
                    st.mol.forEach(m => U.molekul(ctx, m.jenis, m.x, m.y, m.rot, 1));

                    // Percikan api
                    st.percik.forEach(p => {
                        ctx.fillStyle = `rgba(250,204,21,${1 - p.t / .45})`;
                        ctx.beginPath(); ctx.arc(p.x, p.y, 2.4, 0, 6.3); ctx.fill();
                        ctx.strokeStyle = `rgba(249,115,22,${.8 - p.t / .6})`; ctx.lineWidth = 1.5;
                        ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(p.x - p.vx * .04, p.y - p.vy * .04); ctx.stroke();
                    });

                    // Gelombang dan kilatan ledakan
                    if (st.gel > 0 && st.gel < 700) {
                        const g = ctx.createRadialGradient(SAKLAR.x, SAKLAR.y, Math.max(0, st.gel - 40), SAKLAR.x, SAKLAR.y, st.gel + 6);
                        g.addColorStop(0, 'rgba(251,146,60,0)'); g.addColorStop(.8, 'rgba(251,146,60,.35)'); g.addColorStop(1, 'rgba(250,204,21,0)');
                        ctx.fillStyle = g; ctx.fillRect(-10, -10, W + 20, 250);
                    }
                    if (st.bara > 0) { ctx.fillStyle = `rgba(251,146,60,${st.bara * .16})`; ctx.fillRect(-10, -10, W + 20, 250); }
                    if (st.kilat > 0) { ctx.fillStyle = `rgba(255,237,213,${st.kilat * .75})`; ctx.fillRect(-10, -10, W + 20, H + 20); }
                    ctx.restore();

                    // Panel keterangan
                    const jam = Math.max(0, st.jam);
                    U.panel(ctx, [
                        [[`Waktu berlalu: ${jam < 1 ? Math.round(jam * 60) + ' menit' : Math.floor(jam) + ' jam'}`, '#cbd5e1']],
                        [[`Tumbukan: ${st.tumbukan}`, '#fff'], ['   '], [`Reaksi: ${st.reaksi}`, st.reaksi ? '#fb923c' : '#fff']]
                    ], 10, 8);

                    if (L === 4) {
                        const s = 1 + Math.sin(st.waktu * 3) * .05;
                        ctx.save(); ctx.translate(240, 118); ctx.scale(s, s);
                        ctx.beginPath(); ctx.arc(0, 0, 30, 0, 6.3); ctx.fillStyle = '#fff'; ctx.fill();
                        ctx.lineWidth = 3; ctx.strokeStyle = '#2563eb'; ctx.stroke();
                        U.teks(ctx, '?', 0, 2, { ukuran: 36, tebal: 800, warna: '#2563eb', rata: 'center', dasar: 'middle' });
                        ctx.restore();
                    }

                    U.legenda(ctx, [['C3H8', 'C₃H₈ (propana)', 'C₃H₈'], ['O2', 'O₂ (oksigen)', 'O₂'], ['CO2', 'CO₂'], ['H2O', 'H₂O']], 270);
                }
            });
        })();
    </script>

        /* =====================================================================
